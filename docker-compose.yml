services:
  # Base de Datos Relacional (PostgreSQL) - Contiene el esquema 'customers'
  db-profiles:
    image: postgres:16-alpine
    container_name: p3-db-profiles
    restart: always
    environment:
      POSTGRES_DB: profiles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profiles"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
