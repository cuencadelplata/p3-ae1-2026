services:
  # Backend - Módulo 2 (Clientes)
  api:
    image: leangau/m2-perfilhistorialestado:api
    container_name: p3-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db-profiles
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: profiles
      REDIS_URL: redis://redis:6379
      # Stubs internos: los módulos externos se simulan dentro del mismo contenedor
      STUBS_ENABLED: "true"
      M1_SERVICE_URL: http://localhost:3000/__stubs/m1
      SOPORTE_SERVICE_URL: http://localhost:3000/__stubs/soporte
      M6_SERVICE_URL: http://localhost:3000/__stubs/m6
      # Claves de servicio a servicio
      SOPORTE_SECRET_KEY: "secret-m2"
      STATUS_SECRET_KEY: "secret-status"
      # Umbrales de bloqueo automático por penalizaciones (RF-2.5)
      PENALIZACIONES_TEMPORAL: "2"
      PENALIZACIONES_PERMANENTE: "3"
    depends_on:
      db-profiles:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend - React + Vite (servido por nginx)
  client:
    image: leangau/m2-perfilhistorialestado:client
    container_name: p3-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api

  # Base de Datos Relacional (PostgreSQL) - Contiene el esquema 'customers'
  db-profiles:
    image: postgres:16-alpine
    container_name: p3-db-profiles
    restart: always
    environment:
      POSTGRES_DB: profiles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profiles"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: p3-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
