services:
  # ---------------- Infraestructura compartida ----------------
  redis:
    image: redis:7-alpine
    container_name: m3-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: m3-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - default
      - p3-shared   # red compartida con otros módulos (M5, M6...)

  # ---------------- RF-3.2 / RF-3.4: Vehículos y Documentos ----------------
  m3-vehiculos:
    build:
      context: ./m3-vehiculos
      dockerfile: Dockerfile
    image: m3-vehiculos
    container_name: m3-vehiculos
    restart: unless-stopped
    env_file:
      - ./m3-vehiculos/.env.docker
    environment:
      PORT: 8083
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      OTEL_SERVICE_NAME: m3-vehiculos-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-alloy:4318
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ---------------- RF-3.1 / RF-3.3 / Valoraciones: Conductores ----------------
  m3-conductor-api:
    build:
      context: ./M3-Conductor
      dockerfile: Dockerfile
    image: m3-conductor-api
    container_name: m3-conductor-api
    restart: unless-stopped
    env_file:
      - path: ./M3-Conductor/.env
        required: false
    environment:
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TTL_HABILITADO: ${REDIS_TTL_HABILITADO:-300}
      REDIS_TTL_DISPONIBLE: ${REDIS_TTL_DISPONIBLE:-60}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      RABBITMQ_EXCHANGE: m3.conductores.events
      OTEL_SERVICE_NAME: m3-conductor-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://grafana-alloy:4318
    ports:
      - "5000:3000"
    networks:
      default:
        aliases:
          - api   # nginx.conf del frontend hace proxy_pass a http://api:3000
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Consumidor de ejemplo de los eventos de conductores
  m3-conductor-consumer:
    build:
      context: ./M3-Conductor
      dockerfile: Dockerfile
    container_name: m3-conductor-consumer
    restart: unless-stopped
    command: ["npm", "run", "consumer"]
    environment:
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      RABBITMQ_EXCHANGE: m3.conductores.events
      RABBITMQ_EXAMPLE_QUEUE: m3.ejemplo.driver-events
    depends_on:
      m3-conductor-api:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # Frontend de pruebas (nginx). Hace proxy de /api/ hacia http://api:3000
  m3-conductor-frontend:
    build:
      context: ./M3-Conductor
      dockerfile: Dockerfile.client
    container_name: m3-conductor-frontend
    restart: unless-stopped
    ports:
      - "4000:80"
    depends_on:
      m3-conductor-api:
        condition: service_healthy

  # ---------------- Observabilidad: Collector OpenTelemetry + Docker -> Grafana Cloud ----------------
  grafana-alloy:
    image: grafana/alloy:latest
    container_name: m3-grafana-alloy
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy

networks:
  p3-shared:
    name: p3-shared

volumes:
  redis_data:
  rabbitmq_data: