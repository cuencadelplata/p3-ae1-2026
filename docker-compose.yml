services:
  m9-reservas:
    image: ${DOCKER_IMAGE:-m9-reservas-programadas:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      M5_URL: http://m5-stub:3001
      M7_URL: http://m7-stub:3002
      RESERVATION_JOB_INTERVAL: ${RESERVATION_JOB_INTERVAL:-*/30 * * * * *}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$$PORT/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      m5-stub:
        condition: service_healthy
      m7-stub:
        condition: service_healthy
    networks:
      - reservas-network
    restart: unless-stopped

  m5-stub:
    image: ${DOCKER_IMAGE:-m9-reservas-programadas:local}
    pull_policy: never
    command: ["node", "dist/stubs/m5/server.js"]
    environment:
      PORT: 3001
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - reservas-network

  m7-stub:
    image: ${DOCKER_IMAGE:-m9-reservas-programadas:local}
    pull_policy: never
    command: ["node", "dist/stubs/m7/server.js"]
    environment:
      PORT: 3002
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - reservas-network

networks:
  reservas-network:
    driver: bridge
