services:
  m7-app:
    build: .
    env_file:
      - .env
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Defini DATABASE_URL en .env}
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      CARGO_CANCELACION_URL: http://localhost:3007
      SUPABASE_URL: ${SUPABASE_URL:?Defini SUPABASE_URL en .env}
      SUPABASE_KEY: ${SUPABASE_KEY:?Defini SUPABASE_KEY en .env}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      cargo-cancelacion:
        condition: service_started
    restart: on-failure
    network_mode: host

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: historial
    volumes:
      - m7-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d historial"]
      interval: 5s
      timeout: 5s
      retries: 10
    network_mode: host

  redis:
    image: redis:7-alpine
    network_mode: host

  rabbitmq:
    image: rabbitmq:3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
    network_mode: host

  cargo-cancelacion:
    image: node:20-alpine
    command: >
      node -e "require('http').createServer((q,s)=>{let b='';q.on('data',d=>b+=d);q.on('end',()=>{const r=JSON.parse(b||'{}');s.setHeader('Content-Type','application/json');s.end(JSON.stringify({tripId:r.tripId,requestedBy:r.requestedBy,charge:r.requestedBy==='cliente'?1000:0,currency:'ARS'}))})}).listen(3007)"
    network_mode: host

volumes:
  m7-db-data: