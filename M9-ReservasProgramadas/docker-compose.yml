name: m9-reservas-programadas

services:
  m9-reservas:
    image: ${DOCKER_IMAGE:-p3-ae1-2026-m9-reservas:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      M9_AUTH_MODE: ${M9_AUTH_MODE:-m1}
      M1_BASE_URL: ${M1_BASE_URL:-http://m1-identidad-acceso:3001}
      M9_DEMO_AUTH_SECRET: ${M9_DEMO_AUTH_SECRET:-}
      PORT: ${PORT:-3000}
      # Servicios reales del stack `movilidad-urbana` (red reservas-network):
      #   M5 -> modulo-5/compose.integracion.yml (m5-dispatch-service:3005)
      #   M7 -> modulo7/compose.integracion.yml  (m7-api:3000)
      M5_BASE_URL: ${M5_BASE_URL:-http://m5-dispatch-service:3005}
      M7_BASE_URL: ${M7_BASE_URL:-http://m7-api:3000}
      M5_TIMEOUT_MS: ${M5_TIMEOUT_MS:-3000}
      M7_TIMEOUT_MS: ${M7_TIMEOUT_MS:-3000}
      # M5 real no consume los eventos m9.reservas.* (solo lo hacía m5-stub):
      # la activación debe invocar POST /api/v1/ride-requests por REST.
      DISPATCH_MODE: ${DISPATCH_MODE:-rest}
      M9_DISPATCH_AUTH_URL: ${M9_DISPATCH_AUTH_URL:-http://m1-identidad-acceso:3001/auth/token-delegado}
      M9_DISPATCH_AUTH_TOKEN: ${M9_DISPATCH_AUTH_TOKEN:-}
      ACTIVATION_RECOVERY_TIMEOUT_MS: ${ACTIVATION_RECOVERY_TIMEOUT_MS:-120000}
      M5_SERVICE_TOKEN: ${M5_SERVICE_TOKEN:-}
      ROUTE_RESOLVER_MODE: ${ROUTE_RESOLVER_MODE:-m4}
      M4_BASE_URL: ${M4_BASE_URL:-http://m4-api:3004}
      M4_TIMEOUT_MS: ${M4_TIMEOUT_MS:-5000}
      ROUTE_STUB_ORIGIN_LATITUDE: ${ROUTE_STUB_ORIGIN_LATITUDE:--27.4514}
      ROUTE_STUB_ORIGIN_LONGITUDE: ${ROUTE_STUB_ORIGIN_LONGITUDE:--58.9867}
      ROUTE_STUB_DESTINATION_LATITUDE: ${ROUTE_STUB_DESTINATION_LATITUDE:--27.4692}
      ROUTE_STUB_DESTINATION_LONGITUDE: ${ROUTE_STUB_DESTINATION_LONGITUDE:--58.8306}
      ROUTE_STUB_DISTANCE_KM: ${ROUTE_STUB_DISTANCE_KM:-18.4}
      ROUTE_STUB_DURATION_MIN: ${ROUTE_STUB_DURATION_MIN:-28}
      DATABASE_URL: postgresql://${POSTGRES_USER:-m9}:${POSTGRES_PASSWORD:-m9-local}@postgres:5432/${POSTGRES_DB:-m9_reservas}?schema=public&connection_limit=${DATABASE_CONNECTION_LIMIT:-4}
      REDIS_URL: redis://redis:6379
      REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS:-60}
      REDIS_LOCK_TTL_MS: ${REDIS_LOCK_TTL_MS:-10000}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-m9}:${RABBITMQ_PASSWORD:-m9-local}@rabbitmq:5672
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-m9.reservas.events}
      RABBITMQ_RETRY_EXCHANGE: ${RABBITMQ_RETRY_EXCHANGE:-m9.reservas.events.retry}
      RABBITMQ_DLQ_EXCHANGE: ${RABBITMQ_DLQ_EXCHANGE:-m9.reservas.events.dlx}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-m9.reservas}
      RABBITMQ_RETRY_QUEUE: ${RABBITMQ_RETRY_QUEUE:-m9.reservas.retry}
      RABBITMQ_DLQ: ${RABBITMQ_DLQ:-m9.reservas.dlq}
      RABBITMQ_RETRY_LIMIT: ${RABBITMQ_RETRY_LIMIT:-3}
      RABBITMQ_RETRY_DELAY_MS: ${RABBITMQ_RETRY_DELAY_MS:-1000}
      M5_STUB_AUTO_RESPOND: ${M5_STUB_AUTO_RESPOND:-true}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-5000}
      SCHEDULER_CONCURRENCY: ${SCHEDULER_CONCURRENCY:-2}
      RESERVATION_JOB_INTERVAL: ${RESERVATION_JOB_INTERVAL:-*/5 * * * * *}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:$$PORT/health']
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - reservas-network
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    expose:
      - '6379'
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - reservas-network
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-m9}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-m9-local}
      POSTGRES_DB: ${POSTGRES_DB:-m9_reservas}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    expose:
      - '5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - reservas-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-m9}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-m9-local}
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    expose:
      - '5672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # `ping` solo confirma que el nodo Erlang responde; el listener AMQP
      # puede seguir iniciando. M5 necesita que el puerto 5672 ya acepte
      # conexiones antes de arrancar.
      # No crear .erlang.cookie como root durante el primer arranque.
      test:
        [
          'CMD-SHELL',
          'test -s /var/lib/rabbitmq/.erlang.cookie && su-exec rabbitmq rabbitmq-diagnostics -q check_port_connectivity',
        ]
      interval: 5s
      timeout: 15s
      retries: 12
      start_period: 90s
    networks:
      - reservas-network
    restart: unless-stopped

networks:
  reservas-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
