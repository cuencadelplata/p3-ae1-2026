name: m9-reservas-programadas

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservas}
      POSTGRES_USER: ${POSTGRES_USER:-reservas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reservas_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - reservas-network

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://reservas:reservas_dev@postgres:5432/reservas?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - reservas-network
    restart: 'no'

  m9-reservas:
    image: ${DOCKER_IMAGE:-ignacioparra1902/m9-reservas-programadas:v1.0.0}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://reservas:reservas_dev@postgres:5432/reservas?schema=public
      M5_URL: http://m5-stub:3001
      M7_URL: http://m7-stub:3002
      RESERVATION_JOB_INTERVAL: ${RESERVATION_JOB_INTERVAL:-*/30 * * * * *}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:$$PORT/health']
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      m5-stub:
        condition: service_started
      m7-stub:
        condition: service_started
    networks:
      - reservas-network
    restart: unless-stopped

  m5-stub:
    image: ${DOCKER_IMAGE:-ignacioparra1902/m9-reservas-programadas:v1.0.0}
    command: ['node', 'dist/stubs/m5/server.js']
    environment:
      PORT: 3001
      M5_OFERTAS_ESCENARIO: ${M5_OFERTAS_ESCENARIO:-ACEPTAN}
    expose:
      - '3001'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - reservas-network

  m7-stub:
    image: ${DOCKER_IMAGE:-ignacioparra1902/m9-reservas-programadas:v1.0.0}
    command: ['node', 'dist/stubs/m7/server.js']
    environment:
      PORT: 3002
    expose:
      - '3002'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3002/health']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - reservas-network

networks:
  reservas-network:
    driver: bridge

volumes:
  postgres-data:
