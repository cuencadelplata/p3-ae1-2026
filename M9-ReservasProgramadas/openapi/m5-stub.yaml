openapi: 3.0.3
info:
  title: M5 contract double for M9 E2E
  version: 1.1.0
  description: >
    Doble local del contrato M5. Busca candidatos compatibles, prioriza mayor valoración,
    emite ofertas con TTL y avanza al siguiente conductor ante rechazo o vencimiento.
servers:
  - url: http://m5-stub:3001/api/v1
paths:
  /ride-requests:
    post:
      security: [{ BearerAuth: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRideRequestDTO' }
      responses:
        '201':
          description: Solicitud creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideRequestResponseDTO' }
        '400': { description: Datos o idempotencia inválidos }
        '401': { description: Bearer ausente }
        '422': { description: Origen y destino idénticos }
  /ride-requests/{requestId}:
    get:
      security: [{ BearerAuth: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Estado de solicitud
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideRequestResponseDTO' }
        '401': { description: Bearer ausente }
        '404': { description: Solicitud no encontrada }
  /ride-requests/{requestId}/cancel:
    post:
      security: [{ BearerAuth: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 255 }
      responses:
        '200':
          description: Solicitud cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CancelRideRequestResponseDTO' }
        '401': { description: Bearer ausente }
        '404': { description: Solicitud no encontrada }
        '409': { description: Solicitud ya asignada }
  /ride-requests/{requestId}/candidates:
    post:
      summary: Buscar candidatos disponibles y compatibles
      security: [{ BearerAuth: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                radiusKm: { type: number, minimum: 0.1, maximum: 50, default: 5 }
                maxCandidates: { type: integer, minimum: 1, maximum: 50, default: 5 }
      responses:
        '200':
          description: Candidatos ordenados por valoración descendente y distancia ascendente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CandidateSearchResponseDTO' }
        '400': { description: Parámetros inválidos }
        '401': { description: Bearer ausente }
        '404': { description: Solicitud o candidatos no encontrados }
        '409': { description: Estado de solicitud inválido }
  /ride-requests/{requestId}/offers:
    post:
      summary: Enviar una oferta al mejor candidato pendiente
      description: >
        Si driverIds se omite, el stub crea una única oferta para el conductor disponible
        con mayor valoración que aún no haya recibido esta solicitud.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                driverIds:
                  type: array
                  minItems: 1
                  items: { type: string }
                ttlSeconds: { type: integer, minimum: 5, maximum: 180, default: 30 }
      responses:
        '201':
          description: Oferta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendOffersResponseDTO' }
        '400': { description: Parámetros inválidos }
        '401': { description: Bearer ausente }
        '404': { description: Solicitud o candidatos no encontrados }
        '409': { description: Ya existe una oferta activa o el estado es inválido }
    get:
      summary: Consultar ofertas activas e históricas
      security: [{ BearerAuth: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Ofertas de la solicitud
          content:
            application/json:
              schema:
                type: object
                required: [requestId, offersCount, offers]
                properties:
                  requestId: { type: string, format: uuid }
                  offersCount: { type: integer }
                  offers:
                    type: array
                    items: { $ref: '#/components/schemas/RideOfferDTO' }
        '401': { description: Bearer ausente }
        '404': { description: Solicitud no encontrada }
  /offers/{offerId}/respond:
    post:
      summary: Aceptar o rechazar una oferta vigente
      description: >
        ACCEPT asigna el viaje. REJECT genera automáticamente una oferta para el siguiente
        candidato; si no quedan candidatos, la solicitud pasa a NO_DRIVERS_AVAILABLE.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RespondOfferDTO' }
      responses:
        '200':
          description: Respuesta procesada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespondOfferResponseDTO' }
        '400': { description: Respuesta inválida }
        '401': { description: Bearer ausente }
        '403': { description: La oferta pertenece a otro conductor }
        '404': { description: Oferta no encontrada }
        '409': { description: Oferta vencida, respondida o viaje ya asignado }
  /offers/{offerId}/accept:
    post:
      summary: Aceptar una oferta vigente
      security: [{ BearerAuth: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Viaje asignado al conductor de la oferta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespondOfferResponseDTO' }
        '401': { description: Bearer ausente }
        '404': { description: Oferta no encontrada }
        '409': { description: Oferta no vigente }
  /offers/{offerId}/reject:
    post:
      summary: Rechazar una oferta y continuar con el siguiente candidato
      security: [{ BearerAuth: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Oferta rechazada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespondOfferResponseDTO' }
        '401': { description: Bearer ausente }
        '404': { description: Oferta no encontrada }
        '409': { description: Oferta no vigente }
  /offers/{offerId}:
    get:
      summary: Consultar una oferta
      security: [{ BearerAuth: [] }]
      parameters:
        - name: offerId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Oferta encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOfferDTO' }
        '401': { description: Bearer ausente }
        '404': { description: Oferta no encontrada }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    GeoLocation:
      type: object
      required: [latitude, longitude, address]
      properties:
        latitude: { type: number }
        longitude: { type: number }
        address: { type: string }
    CreateRideRequestDTO:
      type: object
      required: [origin, destination, vehicleType]
      properties:
        origin: { $ref: '#/components/schemas/GeoLocation' }
        destination: { $ref: '#/components/schemas/GeoLocation' }
        vehicleType: { type: string, enum: [AUTO, MOTO] }
    RideRequestResponseDTO:
      type: object
      required:
        [
          id,
          clientId,
          origin,
          destination,
          vehicleType,
          status,
          estimatedFare,
          createdAt,
          expiresAt,
        ]
      properties:
        id: { type: string, format: uuid }
        clientId: { type: string }
        origin: { $ref: '#/components/schemas/GeoLocation' }
        destination: { $ref: '#/components/schemas/GeoLocation' }
        vehicleType: { type: string, enum: [AUTO, MOTO] }
        status:
          {
            type: string,
            enum: [PENDING, SEARCHING, OFFERED, ASSIGNED, EXPIRED, NO_DRIVERS_AVAILABLE, CANCELLED],
          }
        assignedDriverId: { type: string, nullable: true }
        estimatedFare: { type: object }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    CancelRideRequestResponseDTO:
      type: object
      required: [requestId, clientId, status, cancelledAt, message]
      properties:
        requestId: { type: string, format: uuid }
        clientId: { type: string }
        status: { type: string, enum: [CANCELLED] }
        reason: { type: string, nullable: true }
        cancelledAt: { type: string, format: date-time }
        message: { type: string }
    CandidateDriverDTO:
      type: object
      required: [driverId, vehicleType, distanceKm, estimatedEtaMinutes, rating]
      properties:
        driverId: { type: string, format: uuid }
        vehicleType: { type: string, enum: [AUTO, MOTO] }
        distanceKm: { type: number, minimum: 0 }
        estimatedEtaMinutes: { type: integer, minimum: 0 }
        rating: { type: number, minimum: 0, maximum: 5 }
    CandidateSearchResponseDTO:
      type: object
      required:
        [requestId, vehicleType, searchRadiusKm, candidatesCount, candidates, searchTimestamp]
      properties:
        requestId: { type: string, format: uuid }
        vehicleType: { type: string, enum: [AUTO, MOTO] }
        searchRadiusKm: { type: number }
        candidatesCount: { type: integer }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/CandidateDriverDTO' }
        searchTimestamp: { type: string, format: date-time }
    RideOfferDTO:
      type: object
      required:
        [
          id,
          requestId,
          driverId,
          status,
          origin,
          destination,
          vehicleType,
          ttlSeconds,
          createdAt,
          expiresAt,
        ]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED, EXPIRED] }
        estimatedFare: { type: object }
        origin: { $ref: '#/components/schemas/GeoLocation' }
        destination: { $ref: '#/components/schemas/GeoLocation' }
        vehicleType: { type: string, enum: [AUTO, MOTO] }
        ttlSeconds: { type: integer }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time, nullable: true }
    SendOffersResponseDTO:
      type: object
      required: [requestId, offersSentCount, offers, message]
      properties:
        requestId: { type: string, format: uuid }
        offersSentCount: { type: integer }
        offers:
          type: array
          items: { $ref: '#/components/schemas/RideOfferDTO' }
        message: { type: string }
    RespondOfferDTO:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [ACCEPT, REJECT] }
        driverId: { type: string, format: uuid }
    RespondOfferResponseDTO:
      type: object
      required:
        [
          offerId,
          requestId,
          driverId,
          action,
          status,
          requestStatus,
          assignedDriverId,
          message,
          respondedAt,
        ]
      properties:
        offerId: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        driverId: { type: string, format: uuid }
        action: { type: string, enum: [ACCEPT, REJECT] }
        status: { type: string, enum: [ACCEPTED, REJECTED] }
        requestStatus:
          {
            type: string,
            enum: [PENDING, SEARCHING, OFFERED, ASSIGNED, EXPIRED, NO_DRIVERS_AVAILABLE],
          }
        assignedDriverId: { type: string, format: uuid, nullable: true }
        message: { type: string }
        respondedAt: { type: string, format: date-time }
