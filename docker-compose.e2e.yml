# Override para E2E: construye las imágenes con el código local en lugar de
# usar las publicadas en Docker Hub.
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
services:
  api:
    build: .
    environment:
      # Pausa corta del circuit breaker: el E2E de "M6 caído" lo abre y la siguiente
      # corrida no debe esperar 30 s a que se cierre
      CIRCUIT_BREAKER_RESET_MS: "1000"
  client:
    build: ./client
