services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - m4-redis-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: m4_locations
      POSTGRES_USER: m4_user
      POSTGRES_PASSWORD: m4_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m4_user -d m4_locations"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - m4-postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  m4-api:
    build: .
    image: segocodee/p3-m4-ubicacion:2.0.0
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      LOCATION_TTL_SECONDS: 60
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://m4_user:m4_password@postgres:5432/m4_locations
      M1_URL: http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  m4-ui:
    build: ../modulo-4-ui
    image: segocodee/p3-m4-ui:1.0.0
    ports:
      - "8084:80"
    depends_on:
      m4-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  m4-redis-data:
  m4-postgres-data:
