services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - m4-redis-data:/data
    restart: unless-stopped

  m4-api:
    build: .
    image: segocodee/p3-m4-ubicacion:2.0.0
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      LOCATION_TTL_SECONDS: 60
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  m4-ui:
    build: ../modulo-4-ui
    image: segocodee/p3-m4-ui:1.0.0
    ports:
      - "8084:80"
    depends_on:
      m4-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  m4-redis-data:
