services:
  m4-api:
    build: .
    image: segocodee/p3-m4-ubicacion:1.3.0
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      LOCATION_TTL_SECONDS: 60
    restart: unless-stopped
  m4-ui:
    build: ../modulo-4-ui
    image: segocodee/p3-m4-ui:1.0.0
    ports:
      - "8084:80"
    depends_on:
      m4-api:
        condition: service_healthy
    restart: unless-stopped
