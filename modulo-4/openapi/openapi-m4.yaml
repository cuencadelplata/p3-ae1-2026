openapi: 3.0.3
info:
  title: Modulo 4 - Ubicacion y Disponibilidad
  version: 2.0.0
  description: |
    API REST para ubicaciones temporales en Redis, disponibilidad operativa, búsqueda para M5,
    historial persistente en PostgreSQL, validación de token/rol con M1 y geocodificación.
servers:
  - url: http://localhost:3004/api/v1
    description: API local directa
  - url: http://localhost:8084/api/v1
    description: API a traves de la UI independiente
tags:
  - name: Ubicaciones
  - name: Busqueda
  - name: Calculos
  - name: Salud
paths:
  /health/liveness:
    get:
      tags: [Salud]
      summary: Liveness Probe - Verificacion de salud basica (RNF-05)
      responses:
        '200':
          description: Servicio M4 activo y respondiendo
          content:
            application/json:
              example: { status: UP, service: m4-location-service, timestamp: "2026-10-05T20:00:00.000Z" }
  /health/readiness:
    get:
      tags: [Salud]
      summary: Readiness Probe - Verificacion de conectividad con Redis y RabbitMQ (RNF-05)
      responses:
        '200':
          description: Servicio M4 y sus dependencias listas
          content:
            application/json:
              example: { status: UP, service: m4-location-service, checks: { redis: connected, rabbitmq: connected } }
        '503':
          description: Dependencia (Redis o RabbitMQ) no disponible
          content:
            application/json:
              example: { status: DOWN, service: m4-location-service, checks: { redis: disconnected, rabbitmq: connected } }
  /drivers/{driverId}/location:
    parameters:
      - $ref: '#/components/parameters/DriverId'
    put:
      tags: [Ubicaciones]
      summary: Actualizar ubicacion del conductor (RF-4.1)
      security:
        - BearerAuth: []
      description: Guarda la ubicacion temporal en Redis y el registro en el historial de PostgreSQL. Valida identidad y rol CONDUCTOR con M1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationUpdate' }
            example: { latitude: -27.4692, longitude: -58.8306, vehicleType: AUTO, available: true }
      responses:
        '200':
          description: Ubicacion actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverLocation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: La actualizacion es anterior a la ubicacion vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: STALE_LOCATION_UPDATE, message: La ubicacion recibida es anterior a la ultima ubicacion registrada }
    get:
      tags: [Ubicaciones]
      summary: Consultar ubicacion activa
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Ubicacion vigente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverLocation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Ubicaciones]
      summary: Eliminar ubicacion del conductor
      security:
        - BearerAuth: []
      responses:
        '204': { description: Ubicacion eliminada }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /drivers/{driverId}/location-history:
    parameters:
      - $ref: '#/components/parameters/DriverId'
      - in: query
        name: limit
        schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        description: Cantidad maxima de registros recientes del historial en PostgreSQL
    get:
      tags: [Ubicaciones]
      summary: Consultar historial persistente de ubicaciones del conductor en PostgreSQL
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Listado de ubicaciones pasadas ordenadas por fecha descendente
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LocationHistoryRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /drivers/{driverId}/availability:
    patch:
      tags: [Ubicaciones]
      summary: Cambiar disponibilidad del conductor
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [available]
              properties:
                available: { type: boolean }
            example: { available: false }
      responses:
        '200':
          description: Disponibilidad actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverLocation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /drivers/nearby:
    get:
      tags: [Busqueda]
      summary: Buscar conductores cercanos para M5 (RF-4.2)
      parameters:
        - { in: query, name: latitude, required: true, schema: { type: number, minimum: -90, maximum: 90 }, example: -27.4692 }
        - { in: query, name: longitude, required: true, schema: { type: number, minimum: -180, maximum: 180 }, example: -58.8306 }
        - { in: query, name: vehicleType, required: true, schema: { type: string, enum: [AUTO, MOTO] } }
        - { in: query, name: radiusKm, schema: { type: number, minimum: 0.1, maximum: 50, default: 5 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 10 }, description: Alias conservado por compatibilidad }
        - { in: query, name: maxCandidates, schema: { type: integer, minimum: 1, maximum: 50, default: 10 }, description: Cantidad maxima solicitada por M5 }
      responses:
        '200':
          description: Conductores vigentes, disponibles y ordenados por distancia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NearbyResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /geocode:
    post:
      tags: [Calculos]
      summary: Geocodificar direccion con proveedor externo / simulado (RF-4.4)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, minLength: 3, maxLength: 200 }
            example: { address: Plaza 25 de Mayo, Corrientes }
      responses:
        '200':
          description: Coordenadas encontradas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeocodeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: Error en el proveedor de geocodificación externo }
        '504': { description: Timeout en la geocodificación externa }
  /estimate:
    post:
      tags: [Calculos]
      summary: Estimar distancia Haversine y ETA (RF-4.5)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin, destination]
              properties:
                origin: { $ref: '#/components/schemas/Coordinates' }
                destination: { $ref: '#/components/schemas/Coordinates' }
            example:
              origin: { latitude: -27.4692, longitude: -58.8306 }
              destination: { latitude: -27.4875, longitude: -58.7896 }
      responses:
        '200':
          description: Distancia y tiempo aproximados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DistanceEstimate' }
        '400': { $ref: '#/components/responses/BadRequest' }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token Bearer devuelto por M1 para validar identidad y rol CONDUCTOR
  parameters:
    DriverId:
      in: path
      name: driverId
      required: true
      schema: { type: integer, minimum: 1 }
      example: 101
  responses:
    BadRequest:
      description: Datos invalidos o error de validación
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Token Bearer invalido o ausente (M1)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Rol de usuario no es CONDUCTOR o el userId no coincide (M1)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Recurso inexistente o vencido por TTL
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    LocationUpdate:
      allOf:
        - $ref: '#/components/schemas/Coordinates'
        - type: object
          required: [vehicleType]
          properties:
            vehicleType: { type: string, enum: [AUTO, MOTO] }
            available: { type: boolean, default: true }
            timestamp: { type: string, format: date-time }
    DriverLocation:
      allOf:
        - $ref: '#/components/schemas/Coordinates'
        - type: object
          required: [driverId, vehicleType, available, updatedAt, expiresAt]
          properties:
            driverId: { type: integer, example: 101 }
            vehicleType: { type: string, enum: [AUTO, MOTO] }
            available: { type: boolean }
            updatedAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
    LocationHistoryRecord:
      allOf:
        - $ref: '#/components/schemas/Coordinates'
        - type: object
          required: [driverId, vehicleType, available, updatedAt]
          properties:
            id: { type: integer, example: 1 }
            driverId: { type: integer, example: 101 }
            vehicleType: { type: string, enum: [AUTO, MOTO] }
            available: { type: boolean }
            updatedAt: { type: string, format: date-time }
    NearbyDriver:
      allOf:
        - $ref: '#/components/schemas/DriverLocation'
        - $ref: '#/components/schemas/DistanceEstimate'
    NearbyResponse:
      type: object
      required: [vehicleType, searchRadiusKm, candidatesCount, searchTimestamp, count, drivers]
      properties:
        vehicleType: { type: string, enum: [AUTO, MOTO] }
        searchRadiusKm: { type: number }
        candidatesCount: { type: integer }
        searchTimestamp: { type: string, format: date-time }
        count: { type: integer }
        drivers:
          type: array
          items: { $ref: '#/components/schemas/NearbyDriver' }
    GeocodeResponse:
      allOf:
        - $ref: '#/components/schemas/Coordinates'
        - type: object
          required: [address, provider]
          properties:
            address: { type: string }
            provider: { type: string }
    DistanceEstimate:
      type: object
      required: [distanceKm, estimatedEtaMinutes]
      properties:
        distanceKm: { type: number, minimum: 0 }
        estimatedEtaMinutes: { type: integer, minimum: 1 }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
