# Gateway de M2 para la app integrada (docker-compose.app.yml): balancea entre las dos
# réplicas de la API (round-robin) con failover pasivo. Escucha en 3000 y en la red usa el
# alias m2-api, así M8 y el front siguen llamando a http://m2-api:3000 sin cambios.

# DNS interno de Docker: si una réplica se recrea con otra IP, el gateway la sigue.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream m2_api {
    zone m2_api 64k;
    # Tras 2 fallas, la réplica queda fuera de rotación 10 s y se vuelve a probar.
    server m2-api-1:3000 resolve max_fails=2 fail_timeout=10s;
    server m2-api-2:3000 resolve max_fails=2 fail_timeout=10s;
    keepalive 16;
}

server {
    listen 3000;
    server_name _;

    location / {
        proxy_pass http://m2_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Si una réplica no responde, el pedido se reintenta en la otra.
        # No se reintenta ante 503: es la respuesta degradada intencional de M2
        # (p. ej. M1 caído) y la otra réplica respondería lo mismo.
        # nginx no reintenta métodos no idempotentes (POST, PATCH): sin efectos duplicados.
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 2;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;

        # Conserva el x-correlation-id y la autenticación del llamador (M8, front).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Para la demo: qué réplica respondió cada pedido
        add_header X-Upstream $upstream_addr always;
    }
}
