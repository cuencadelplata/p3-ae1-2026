# Se incluye desde docker-compose.yml de la raíz.
# Redis y RabbitMQ pertenecen al stack común. PostgreSQL es exclusivo de M8.
# Los valores vacíos permiten iniciar otros módulos sin configurar M8.
# Para iniciar M8, completar la configuración privada de INTEGRACION_COMPOSE.md.
services:
  m8-app:
    image: "${M8_IMAGE:-modulo-8-m8-app:local}"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${M8_HOST_PORT:-18000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Más hilos de libuv: DNS, bcrypt y zlib comparten el pool (4 por defecto) en la app única.
      UV_THREADPOOL_SIZE: "16"
      PUBLIC_BASE_URL: "${M8_PUBLIC_BASE_URL:-http://localhost:${M8_HOST_PORT:-18000}}"
      NOTIFICATIONS_DATABASE_URL: "postgres://m8_notifications:${M8_NOTIFICATIONS_DB_PASSWORD:-}@m8-postgres:5432/m8"
      RECEIPTS_DATABASE_URL: "postgres://m8_receipts:${M8_RECEIPTS_DB_PASSWORD:-}@m8-postgres:5432/m8"
      SUPPORT_DATABASE_URL: "postgres://m8_support:${M8_SUPPORT_DB_PASSWORD:-}@m8-postgres:5432/m8"
      DELIVERY_DATABASE_URL: "postgres://m8_notification_delivery:${M8_DELIVERY_DB_PASSWORD:-}@m8-postgres:5432/m8"
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-m9}:${RABBITMQ_PASSWORD:-m9-local}@rabbitmq:5672"
      QR_INTERNAL_API_KEY: "${QR_INTERNAL_API_KEY:-}"
      QR_TTL_SECONDS: "${M8_QR_TTL_SECONDS:-300}"
      QR_EXPIRED_GRACE_SECONDS: "${M8_QR_EXPIRED_GRACE_SECONDS:-3600}"
      M1_JWT_SECRET: "${M1_JWT_SECRET:-}"
      M1_IDENTITY_URL: "${M8_M1_IDENTITY_URL:-http://m1-identidad-acceso:3001/auth/validar-identidad-y-rol}"
      # RF-8.5: con M1 configurado, /tickets exige un Bearer válido de M1 (sin esto queda abierto).
      SUPPORT_M1_IDENTITY_URL: "${M8_SUPPORT_M1_IDENTITY_URL:-http://m1-identidad-acceso:3001}"
      M2_API_URL: "${M8_M2_API_URL:-http://m2-api:3000}"
      M2_INTERNAL_API_KEY: "${M2_INTERNAL_API_KEY:-}"
      M3_CONDUCTOR_BASE_URL: "${M8_M3_CONDUCTOR_BASE_URL:-http://m3-conductor-api:3000}"
      M3_VEHICLES_BASE_URL: "${M8_M3_VEHICLES_BASE_URL:-http://m3-vehiculos:8083}"
      # RF-8.3 recibe el TripCompleted de M6 y le consulta el recorrido del viaje.
      M6_TRIPS_URL: "${M8_M6_TRIPS_URL:-http://m6-viajes:3000}"
      M7_PAYMENTS_URL: "${M8_M7_PAYMENTS_URL:-http://m7-api:3000}"
      M7_API_KEY: "${M7_API_KEY:-}"
      FISCAL_API_URL: "${M8_FISCAL_API_URL:-http://m8-fiscal-sandbox:4010}"
    depends_on:
      m8-fiscal-sandbox:
        condition: service_started
      m8-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - reservas-network
    restart: unless-stopped

  # Autorizador fiscal externo simulado que usa RF-8.3 antes de generar el PDF.
  # Es una dependencia propia de M8 (proveedor externo), sin puerto en el host.
  m8-fiscal-sandbox:
    build:
      context: ./infra/fiscal-sandbox
    environment:
      FISCAL_MODE: "${M8_FISCAL_MODE:-normal}"
    networks:
      - reservas-network
    restart: unless-stopped

  # Simulador del contrato de M7 (tarifa y pagos) para cuando M7 no puede correr
  # en el stack común. No arranca por defecto: perfil m7-sandbox, y M6 y M8 lo
  # usan solo si M6_M7_URL y M8_M7_PAYMENTS_URL apuntan a él (INTEGRACION_COMPOSE.md).
  m8-m7-sandbox:
    profiles: ["m7-sandbox"]
    build:
      context: ./infra/m7-payments-sandbox
    environment:
      UNREGISTERED_TRIPS: not_found
      M7_API_KEY: "${M7_API_KEY:-}"
    networks:
      - reservas-network
    restart: unless-stopped

  # Métricas de m8-app hacia Grafana Cloud desde el stack común (misma
  # configuración que el Compose aislado). Perfil observability; credenciales
  # GRAFANA_CLOUD_* en .env.integracion.
  m8-alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.22.0
    volumes:
      - ./infra/observability/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      GRAFANA_CLOUD_REMOTE_WRITE_URL: "${GRAFANA_CLOUD_REMOTE_WRITE_URL:-}"
      GRAFANA_CLOUD_USER: "${GRAFANA_CLOUD_USER:-}"
      GRAFANA_CLOUD_TOKEN: "${GRAFANA_CLOUD_TOKEN:-}"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    depends_on:
      - m8-app
    networks:
      - reservas-network
    restart: unless-stopped

  m8-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: m8_admin
      POSTGRES_DB: m8
      POSTGRES_PASSWORD: "${M8_POSTGRES_PASSWORD:-}"
      NOTIFICATIONS_DB_PASSWORD: "${M8_NOTIFICATIONS_DB_PASSWORD:-}"
      RECEIPTS_DB_PASSWORD: "${M8_RECEIPTS_DB_PASSWORD:-}"
      SUPPORT_DB_PASSWORD: "${M8_SUPPORT_DB_PASSWORD:-}"
      DELIVERY_DB_PASSWORD: "${M8_DELIVERY_DB_PASSWORD:-}"
    volumes:
      - m8-integration-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m8_admin -d m8"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - reservas-network
    restart: unless-stopped

volumes:
  m8-integration-postgres:
