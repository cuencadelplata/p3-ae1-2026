server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS de Docker. Resolver bajo demanda permite usar M1 aunque falten otros módulos.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ~ ^/auth/(?:iniciar-sesion|registrar-usuario|me|validar-identidad-y-rol|revocar-credenciales|solicitar-recuperacion|resetear-contrasena|oauth2/(?:providers|authorize|callback|userinfo))$ {
        set $m1_upstream http://m1-identidad-acceso:3001;
        proxy_pass $m1_upstream$request_uri;
    }
    location ~ ^/flujo-api/m2(?<m2_path>/v1/customers(?:/me|/cust_[a-zA-Z0-9_-]+)?)$ {
        proxy_pass http://m2-gateway:3000$m2_path$is_args$args;
    }
    location ~ ^/flujo-api/m3(?<m3_path>/api/conductores(?:/[0-9]+/(?:estado|habilitado))?)$ {
        proxy_pass http://m3-conductor-api:3000$m3_path$is_args$args;
    }
    location ~ ^/flujo-api/m3-vehiculos(?<vehicles_path>/api/v1/drivers/[0-9]+/vehicles(?:/[a-zA-Z0-9-]+/activar)?)$ {
        proxy_pass http://m3-vehiculos:8083$vehicles_path$is_args$args;
    }
    location ~ ^/flujo-api/m4(?<m4_path>/api/v1/drivers/[0-9]+/location)$ {
        proxy_pass http://m4-api:3004$m4_path$is_args$args;
    }
    location ~ ^/flujo-api/m4(?<tracking_path>/api/v1/trips/[a-fA-F0-9-]+/driver-location)$ {
        proxy_pass http://m4-api:3004$tracking_path$is_args$args;
    }
    location ~ ^/flujo-api/m5(?<m5_path>/api/v1/(?:ride-requests(?:/[a-zA-Z0-9-]+(?:/(?:offers|cancel|cancel-assigned))?)?|drivers/[0-9]+/offers|offers/[a-zA-Z0-9_-]+/(?:accept|reject)))$ {
        proxy_pass http://m5-dispatch-service:3005$m5_path$is_args$args;
    }
    location ~ ^/flujo-api/m6(?<m6_path>/api/viajes(?:/[a-zA-Z0-9-]+(?:/(?:arribo|iniciar|destino|finalizacion))?)?)$ {
        proxy_pass http://m6-viajes:3000$m6_path$is_args$args;
    }
    # RF-6.5/6.6: cancelación de pasajero y conductor mediante M6.
    location ~ ^/flujo-api/m6-cancelacion(?<cancel_path>/api/viajes/[a-zA-Z0-9-]+/cancelacion-(?:cliente|conductor))$ {
        proxy_pass http://m6-cancelacion:3001$cancel_path$is_args$args;
    }
    location ~ ^/flujo-api/m8(?<m8_path>/api/v1/receipts/[a-zA-Z0-9-]+(?:/pdf)?)$ {
        proxy_pass http://m8-app:3000$m8_path$is_args$args;
    }
    location ~ "^/flujo-api/m9(?<m9_path>/reservas(?:/[a-fA-F0-9-]{36})?)$" {
        proxy_pass http://m9-reservas:3000$m9_path$is_args$args;
    }
    location = /flujo-api/m8/tickets {
        set $support_upstream http://m8-app:3000;
        proxy_pass $support_upstream/tickets$is_args$args;
    }
    location = /flujo-api/m8/tickets/mios {
        set $support_upstream http://m8-app:3000;
        proxy_pass $support_upstream/tickets/mios$is_args$args;
    }
    location = /push {
        return 302 /;
    }
    location ~ ^/push/(?:sw\.js|app-sw\.js|config)$ {
        set $push_upstream http://m8-app:3000;
        proxy_pass $push_upstream$request_uri;
    }
    location = /flujo-api/m8/push/config {
        set $push_upstream http://m8-app:3000;
        proxy_pass $push_upstream/push/config;
    }
    location = /flujo-api/m8/notifications/me {
        set $notifications_upstream http://m8-app:3000;
        proxy_pass $notifications_upstream/notifications/me;
    }
    location ~ ^/flujo-api/m8(?<push_path>/devices/tokens(?:/deactivate)?)$ {
        set $push_upstream http://m8-app:3000;
        proxy_pass $push_upstream$push_path;
    }
    location ~ ^/devices/tokens(?:/.*)?$ {
        set $push_upstream http://m8-app:3000;
        proxy_pass $push_upstream$request_uri;
    }
    location /flujo-api/ {
        return 404;
    }

    # SPA: cualquier ruta desconocida devuelve index.html.
    # Google y Auth0 vuelven a "/?code=...&state=..." y React completa el login (RF-1.5).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html sin caché, para que después de un rebuild se vea la versión nueva.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
