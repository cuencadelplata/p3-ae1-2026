openapi: 3.0.3
info:
  title: API M6 - Cancelación de viajes
  version: 1.0.0
paths:
  /api/viajes/{viajeId}/cancelacion-cliente:
    post:
      summary: Cancela un viaje por solicitud del cliente
      parameters:
        - { name: viajeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelarViaje' }
      responses:
        '200': { description: Viaje cancelado }
        '400': { description: Viaje en estado no cancelable o motivo inválido }
        '404': { description: Viaje no encontrado en RF-6 }
  /api/viajes/{viajeId}/cancelacion-conductor:
    post:
      summary: Cancela un viaje por solicitud del conductor
      parameters:
        - { name: viajeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelarViaje' }
      responses:
        '200': { description: Viaje cancelado y evento despacho.reabrir publicado }
        '400': { description: Viaje en estado no cancelable o motivo inválido }
        '404': { description: Viaje no encontrado en RF-6 }
components:
  schemas:
    CancelarViaje:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 1 }