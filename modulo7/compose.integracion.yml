services:
  m7-api:
    image: aylen0/m7-tarifas-ae2:latest
    ports:
      - "17000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-m9}:${RABBITMQ_PASSWORD:-m9-local}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://m7user:m7pass@m7-postgres:5432/m7db?sslmode=disable
      CARGO_CANCELACION_URL: http://m7-cargo-cancelacion:3007
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      m7-postgres:
        condition: service_healthy
    networks:
      - reservas-network
    restart: on-failure

  m7-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: m7user
      POSTGRES_PASSWORD: m7pass
      POSTGRES_DB: m7db
    volumes:
      - m7-postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m7user -d m7db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - reservas-network

  m7-cargo-cancelacion:
    image: node:22-alpine
    command: >
      node -e "require('http').createServer((q,s)=>{let b='';q.on('data',d=>b+=d);q.on('end',()=>{const r=JSON.parse(b||'{}');s.setHeader('Content-Type','application/json');s.end(JSON.stringify({tripId:r.tripId,requestedBy:r.requestedBy,charge:r.requestedBy==='cliente'?1000:0,currency:'ARS'}))})}).listen(3007)"
    networks:
      - reservas-network

volumes:
  m7-postgres-data:

networks:
  reservas-network:
    driver: bridge
