services:
  m7-api:
    image: "${M7_IMAGE:-movilidad-urbana-m7:local}"
    build:
      context: .
    ports:
      - "17000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-m9}:${RABBITMQ_PASSWORD:-m9-local}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      CARGO_CANCELACION_URL: http://m7-api:3000
    networks:
      - reservas-network
    restart: on-failure

networks:
  reservas-network:
    external: true
