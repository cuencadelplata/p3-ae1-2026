services:
  m7-api:
    image: aylen0/m7-tarifas-ae2:latest
    ports:
      - "17000:3000"
    env_file: .env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      CARGO_CANCELACION_URL: http://localhost:3000
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - movilidad-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "17001:5672"
      - "17002:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 12
    networks:
      - movilidad-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - movilidad-network

  grafana-alloy:
    image: grafana/alloy:latest
    env_file: .env
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    command: run /etc/alloy/config.alloy
    restart: on-failure
    networks:
      - movilidad-network

networks:
  movilidad-network:
    external: true