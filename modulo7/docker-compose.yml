services:
  m7-api:
    image: aylen0/m7-tarifas-ae2:latest
    ports:
      - "17000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-m9}:${RABBITMQ_PASSWORD:-m9-local}@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://m7user:m7pass@m7-postgres:5432/m7db?sslmode=disable
      # m7-cargo-cancelacion es un servicio Express separado (Lautaro, M7-cargo-cancelacion/).
      # Corre en su propio contenedor en el puerto 3007.
      CARGO_CANCELACION_URL: http://m7-cargo-cancelacion:3007
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      m7-postgres:
        condition: service_healthy
      m7-cargo-cancelacion:
        condition: service_healthy
    networks:
      - reservas-network
    restart: on-failure

  m7-cargo-cancelacion:
    build:
      context: ./M7-cargo-cancelacion
      dockerfile: Dockerfile
    ports:
      - "17007:3007"
    environment:
      PORT: 3007
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3007/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - reservas-network
    restart: on-failure

  m7-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: m7user
      POSTGRES_PASSWORD: m7pass
      POSTGRES_DB: m7db
    volumes:
      - m7-postgres-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m7user -d m7db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - reservas-network

volumes:
  m7-postgres-data:

networks:
  reservas-network:
    driver: bridge