# Microservicio M3-Conductor (API + Kafka fallback).
# Redis y RabbitMQ son compartidos: se levantan desde ../docker-compose.yml
# (contenedores m3-redis / m3-rabbitmq en la red p3-shared).
#
# Antes de levantar este compose:
#   cd .. && docker compose up -d redis rabbitmq
#
# Luego:
#   docker compose up -d --build

services:
  # Cola temporal. Queda apagada mientras RabbitMQ responde.
  # El circuit breaker la enciende con docker start y la apaga con docker stop.
  kafka:
    image: apache/kafka:3.9.1
    container_name: p3-m3-kafka
    hostname: kafka
    restart: "no"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9094,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9094,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - default

  # Backend Node.js - Conductores & Valoraciones
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: p3-m3-api
    container_name: p3-m3-api
    restart: unless-stopped
    ports:
      - "5000:3000"
    environment:
      PORT: 3000

      # Infra compartida (m3-redis / m3-rabbitmq en p3-shared)
      REDIS_HOST: m3-redis
      REDIS_PORT: 6379
      REDIS_TTL_HABILITADO: ${REDIS_TTL_HABILITADO:-300}
      REDIS_TTL_DISPONIBLE: ${REDIS_TTL_DISPONIBLE:-60}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1000}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-500}
      REDIS_HEALTHCHECK_INTERVAL_MS: ${REDIS_HEALTHCHECK_INTERVAL_MS:-10000}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

      RABBITMQ_HOST: m3-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
      RABBITMQ_URL: amqp://admin:admin123@m3-rabbitmq:5672
      RABBITMQ_EXCHANGE: m3.conductores.events
      KAFKA_BROKERS: kafka:9094
      KAFKA_CONTAINER: p3-m3-kafka
      KAFKA_FALLBACK_TOPIC: m3.fallback

      OTEL_SERVICE_NAME: m3-conductor-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      M6_VIAJES_URL: ${M6_VIAJES_URL:-http://viajes:3000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default
      - p3-shared
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Contratos HTTP que M6 necesita para arribo/finalización (no simulan el evento).
  m6-sim:
    image: p3-ae1-2026-modulo6:local
    build:
      context: ../../modulo6
      dockerfile: Dockerfile
    container_name: p3-m3-m6-sim
    restart: unless-stopped
    command: ["node", "dist/simulator/rf-6.4-6.7/m6-rf-6.4-rf6.7/server.js"]
    environment:
      PORT: "3001"
    expose:
      - "3001"
    networks:
      - default
      - p3-shared

  m7-e2e:
    build:
      context: ../../modulo6/tests-e2e/support
      dockerfile: Dockerfile
    container_name: p3-m3-m7-e2e
    restart: unless-stopped
    environment:
      PROVIDER: m7
      INTERNAL_API_KEY: m3-m6-m7-secret
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default
      - p3-shared

  m8-e2e:
    build:
      context: ../../modulo6/tests-e2e/support
      dockerfile: Dockerfile
    container_name: p3-m3-m8-e2e
    restart: unless-stopped
    environment:
      PROVIDER: m8
      INTERNAL_API_KEY: m3-m6-qr-secret
      PORT: "3000"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - default
      - p3-shared

  # M6 — Viajes: publica viaje.finalizado en viajes.events (Rabbit compartido).
  # Valoraciones (M3) lo consume para habilitar la valoración del pasajero.
  m6-tripdb:
    image: p3-ae1-2026-modulo6-db:local
    build:
      context: ../../modulo6
      dockerfile: Dockerfile.postgres
    container_name: p3-m3-m6-tripdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: m6
      POSTGRES_PASSWORD: ${M6_DB_PASSWORD:-m6pass}
      POSTGRES_DB: tripdb
    volumes:
      - m6_tripdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m6 -d tripdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default

  viajes:
    image: p3-ae1-2026-modulo6:local
    build:
      context: ../../modulo6
      dockerfile: Dockerfile
    container_name: p3-m3-viajes
    restart: unless-stopped
    command:
      [
        "node",
        "--import",
        "./dist/src/observabilidad/telemetria.js",
        "dist/src/rf-6.1-6.2-6.3/index.js",
      ]
    ports:
      - "${M6_VIAJES_HOST_PORT:-15000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: m6-tripdb
      DB_PORT: "5432"
      DB_USER: m6
      DB_PASSWORD: ${M6_DB_PASSWORD:-m6pass}
      DB_NAME: tripdb
      REDIS_URL: redis://m3-redis:6379
      RABBITMQ_URL: amqp://admin:admin123@m3-rabbitmq:5672
      M3_URL: ${M6_M3_URL:-http://api:3000}
      M4_URL: ${M6_M4_URL:-http://m6-sim:3001/api/v1}
      M7_URL: ${M6_M7_URL:-http://m7-e2e:3000}
      M7_API_KEY: ${M7_API_KEY:-m3-m6-m7-secret}
      M8_URL: ${M6_M8_URL:-http://m8-e2e:3000}
      M8_QR_API_KEY: ${QR_INTERNAL_API_KEY:-m3-m6-qr-secret}
      OTEL_SERVICE_NAME: m6-viajes
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      m6-tripdb:
        condition: service_healthy
      api:
        condition: service_healthy
      m6-sim:
        condition: service_started
      m7-e2e:
        condition: service_healthy
      m8-e2e:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - default
      - p3-shared

  # Frontends React de src/app (alta-conductor.tsx y valoraciones.tsx),
  # compilados en Dockerfile.client y servidos por Nginx.
  #   http://localhost:4000/alta-conductor.html
  #   http://localhost:4000/valoraciones.html
  # Nginx hace proxy de /api/ hacia http://api:3000
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    image: p3-m3-frontend
    container_name: p3-m3-frontend
    restart: unless-stopped
    ports:
      - "4000:80"
    networks:
      - default
    depends_on:
      api:
        condition: service_healthy

networks:
  p3-shared:
    external: true
    name: p3-shared

volumes:
  m6_tripdb_data:
