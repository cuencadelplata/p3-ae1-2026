server {
    listen 80;
    server_name localhost;

    # Servir la interfaz web del frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # SSE: Nginx no debe bufferar el stream de notificaciones
    location = /api/valoraciones/notificaciones/stream {
        proxy_pass http://api:3000/api/valoraciones/notificaciones/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Redirigir peticiones /api hacia el contenedor del backend
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy al servicio real de Viajes (M6) para el flujo desde el frontend.
    # DNS de Docker (127.0.0.11) en cada request; rewrite porque proxy_pass con
    # variables no recorta el prefijo /viajes-api/.
    location /viajes-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $viajes_host m6-viajes;
        rewrite ^/viajes-api/(.*)$ /$1 break;
        proxy_pass http://$viajes_host:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # m3-vehiculos no se publica en el deploy. El alta lo usa por el mismo origen.
    location /vehiculos-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $vehiculos_host m3-vehiculos;
        rewrite ^/vehiculos-api/(.*)$ /$1 break;
        proxy_pass http://$vehiculos_host:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 2m;
        proxy_read_timeout 60s;
    }

    # Proxy al servicio real de Identidad y Acceso (M1) para iniciar sesión
    # y validar JWT desde alta-conductor.html y valoraciones.html sin CORS.
    location /m1-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $m1_host m1-identidad-acceso;
        rewrite ^/m1-api/(.*)$ /$1 break;
        proxy_pass http://$m1_host:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
