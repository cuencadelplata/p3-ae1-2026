# =============================================================================
# Balanceador de carga de la API de Conductores (M3)
# Se monta en el contenedor m3-conductor-api cuando se usa compose.escalado.yml
# =============================================================================

# DNS interno de Docker: devuelve la IP de TODAS las réplicas de
# m3-conductor-worker. Se vuelve a consultar cada 5 s, así al cambiar la
# cantidad de réplicas (--scale) el balanceador se entera solo.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream conductores {
    zone conductores 64k;

    # least_conn: cada pedido va a la réplica con MENOS pedidos en curso.
    # Se eligió en lugar de round-robin porque se parece más al modelo M/M/c
    # (una sola fila, y el próximo cliente pasa al primer servidor libre).
    # Round-robin, en cambio, se comporta como c filas M/M/1 separadas.
    least_conn;

    server m3-conductor-worker:3000 resolve;
    keepalive 32;
}

# Log de cada pedido: qué réplica lo atendió y cuánto tardó.
#   rt  = tiempo total en el balanceador (espera + servicio)  -> W
#   urt = tiempo de respuesta de la réplica (servicio)        -> 1/μ
log_format balanceo '$remote_addr [$time_local] "$request" $status '
                    'replica=$upstream_addr rt=$request_time urt=$upstream_response_time';

server {
    listen 3000;          # IPv4
    listen [::]:3000;     # IPv6 (por si algún cliente llega por ::1)
    access_log /dev/stdout balanceo;

    # Stream de notificaciones en vivo (SSE): sin buffer y con conexión larga
    location = /api/valoraciones/notificaciones/stream {
        proxy_pass http://conductores;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://conductores;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Si una réplica falla, el pedido se reintenta en otra
        proxy_next_upstream error timeout http_502 http_503;

        # Encabezado para ver en la respuesta qué réplica atendió el pedido
        add_header X-Servido-Por $upstream_addr always;
    }
}
