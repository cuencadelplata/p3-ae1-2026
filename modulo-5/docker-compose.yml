services:
  # ----------------------------------------------------
  # 1. Backing Service: PostgreSQL (DispatchDB de M5)
  # ----------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: m5-postgres-db
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=dispatch_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 2. Backing Service: Redis (Caché, TTL y Locks)
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: m5-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 3. Backing Service: RabbitMQ (Broker de Mensajería)
  # ----------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: m5-rabbitmq
    ports:
      - '5672:5672'    # Protocolo AMQP
      - '15672:15672'  # Panel Web de Administración
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------
  # 4. Microservicio M5: Solicitud y Despacho
  # ----------------------------------------------------
  dispatch-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: p3-ae1/m5-dispatch-service:latest
    container_name: m5-dispatch-service
    ports:
      - '3005:3005'
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DATABASE_URL=postgresql://postgres:postgres@postgres-db:5432/dispatch_db?schema=public
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - M1_AUTH_URL=http://m1-auth:3001
      - M4_SERVICE_URL=http://m4-service:3004
      - M6_SERVICE_URL=http://m6-service:3000
      - M7_SERVICE_URL=http://m7-service:3007
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./openapi:/app/openapi:ro
      - ./public:/app/public:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3005/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------
  # 5. Documentación Interactiva Scalar (Nginx)
  # ----------------------------------------------------
  scalar-docs:
    build:
      context: .
      dockerfile: scalar/Dockerfile
    image: p3-ae1/m5-scalar-docs:latest
    container_name: m5-scalar-docs
    ports:
      - '3006:80'
    volumes:
      - ./openapi:/usr/share/nginx/html/openapi:ro
      - ./scalar/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - dispatch-service
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
