version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: m5-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: m5-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  dispatch-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: p3-ae1/m5-dispatch-service:latest
    container_name: m5-dispatch-service
    ports:
      - '3005:3005'
    environment:
      - NODE_ENV=production
      - PORT=3005
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
    depends_on:
      - redis
      - rabbitmq
    restart: unless-stopped
    volumes:
      - ./openapi:/app/openapi:ro
      - ./public:/app/public:ro
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3005/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  scalar-docs:
    build:
      context: .
      dockerfile: scalar/Dockerfile
    image: p3-ae1/m5-scalar-docs:latest
    container_name: m5-scalar-docs
    ports:
      - '3006:80'
    volumes:
      - ./openapi:/usr/share/nginx/html/openapi:ro
      - ./scalar/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - dispatch-service
    restart: unless-stopped

volumes:
  redis-data:
  rabbitmq-data:

