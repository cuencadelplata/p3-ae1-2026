informacion_actividad:
  materia: "Paradigmas y Lenguajes de Programación III"
  ano: 2026
  instancia: "AE2 - Evolución Individual v2.0"
  alumno: "Agustín Quetglas"
  modulo: "Módulo 5: Solicitud y Despacho"
  requisito_funcional_individual: "RF-5.1: Solicitud de viaje"

alcance_individual:
  descripcion: |
    El cliente solicita un viaje indicando origen, destino y tipo de vehículo (Auto/Moto).
    En AE2, se evoluciona la implementación base de AE1 resolviendo:
    1. Comunicación Síncrona REST con el Módulo 7 (Tarifas, Pagos y Liquidaciones) para la estimación de la tarifa (RF-7.1), reemplazando stubs locales en memoria.
    2. Incorporación de Redis para control de idempotencia distribuida (RNF-08) y candado atómico de viaje activo por cliente (RNF-09) con TTL.
    3. Manejo explícito de fallos y resiliencia ante indisponibilidad del servicio de tarifas.
  modulos_excluidos_individual: |
    Los requerimientos RF-5.2 a RF-5.8 (búsqueda de candidatos, despacho de ofertas, aceptación/rechazo concurrente y cancelación de despacho)
    corresponden a los demás compañeros del equipo para la etapa grupal posterior.

# ==============================================================================
# CONTRATOS COMPARTIDOS — COMUNICACIÓN SÍNCRONA (REST / HTTP)
# ==============================================================================
contratos_sincronos:
  - id: "INTEGRACION-M5-M7-TARIFA"
    titulo: "Consulta de Estimación de Tarifa"
    consumidor: "Módulo 5 (Solicitud y Despacho - Agustín Quetglas)"
    proveedor: "Módulo 7 (Tarifas, Pagos y Liquidaciones)"
    requisito_relacionado: "RF-7.1 (Estimación de tarifa) -> RF-5.1 (Solicitud de viaje)"
    protocolo: "REST / HTTP"
    metodo: "POST"
    ruta: "/tarifa/estimacion"
    fuente_contrato: "OpenAPI Módulo 7 (RF-7.1)"
    headers:
      Content-Type: "application/json"
    request:
      schema:
        type: "object"
        required:
          - origen
          - destino
          - distanciaKm
          - tiempoEstimadoMin
          - vehicleType
        properties:
          origen:
            type: "object"
            required:
              - lat
              - lng
            properties:
              lat:
                type: "number"
                format: "double"
                example: -34.6037
              lng:
                type: "number"
                format: "double"
                example: -58.3816
              direccion:
                type: "string"
                example: "Av. 9 de Julio 500"
          destino:
            type: "object"
            required:
              - lat
              - lng
            properties:
              lat:
                type: "number"
                format: "double"
                example: -34.5885
              lng:
                type: "number"
                format: "double"
                example: -58.3974
              direccion:
                type: "string"
                example: "Av. Santa Fe 2500"
          distanciaKm:
            type: "number"
            minimum: 0.1
            description: "Distancia calculada en kilómetros para el trayecto"
            example: 3.8
          tiempoEstimadoMin:
            type: "number"
            minimum: 1
            description: "Tiempo estimado en minutos para el trayecto"
            example: 12
          vehicleType:
            type: "string"
            enum: ["auto", "moto"]
            description: "Tipo de vehículo solicitado por el cliente"
            example: "auto"
      ejemplo:
        origen:
          lat: -27.46
          lng: -58.98
          direccion: "Av. Costanera 1234"
        destino:
          lat: -27.47
          lng: -58.99
          direccion: "San Juan 500"
        distanciaKm: 3.5
        tiempoEstimadoMin: 12
        vehicleType: "auto"

    responses:
      200:
        description: "Tarifa calculada con éxito por el Módulo 7"
        schema:
          type: "object"
          required:
            - estimacionId
            - distanciaKm
            - tiempoEstimadoMin
            - vehicleType
            - estimatedFare
            - currency
            - desglose
            - calculadoEn
          properties:
            estimacionId:
              type: "string"
              example: "est_1234567890"
            distanciaKm:
              type: "number"
              example: 3.5
            tiempoEstimadoMin:
              type: "number"
              example: 12
            vehicleType:
              type: "string"
              example: "auto"
            estimatedFare:
              type: "number"
              description: "Monto total calculado para el viaje en la moneda indicada"
              example: 2225.00
            currency:
              type: "string"
              example: "ARS"
            desglose:
              type: "object"
              properties:
                tarifaBase:
                  type: "number"
                  example: 500
                costoDistancia:
                  type: "number"
                  example: 875
                costoTiempo:
                  type: "number"
                  example: 600
                multiplicadorVehiculo:
                  type: "number"
                  example: 1.0
            calculadoEn:
              type: "string"
              format: "date-time"
              example: "2026-10-04T19:42:00.000Z"
        ejemplo:
          estimacionId: "est_1234567890"
          distanciaKm: 3.5
          tiempoEstimadoMin: 12
          vehicleType: "auto"
          estimatedFare: 2225.00
          currency: "ARS"
          desglose:
            tarifaBase: 500
            costoDistancia: 875
            costoTiempo: 600
            multiplicadorVehiculo: 1.0
          calculadoEn: "2026-10-04T19:42:00.000Z"

      400:
        description: "Error de validación en parámetros de cálculo"
        schema:
          type: "object"
          properties:
            error:
              type: "string"
              example: "distanciaKm debe ser un número mayor a 0"

# ==============================================================================
# CONTRATOS COMPARTIDOS — COMUNICACIÓN ASÍNCRONA (RabbitMQ / Mensajería)
# ==============================================================================
contratos_asincronos:
  - id: "EVENTO-M5-RIDE-REQUESTED"
    titulo: "Evento de Dominio: Solicitud de Viaje Creada"
    productor: "Módulo 5 (Solicitud y Despacho - Agustín Quetglas)"
    consumidores_potenciales:
      - "Módulo 8 (Notificaciones, Documentos y Soporte - Notificación al cliente)"
      - "Módulo 4 (Ubicación y Disponibilidad - Radar de demanda)"
    requisito_relacionado: "RF-5.1 (Solicitud de viaje) -> RNF-07 (Mensajería RabbitMQ)"
    mecanismo: "RabbitMQ (AMQP 0-9-1)"
    exchange: "mobility.events"
    exchange_type: "topic"
    routing_key: "ride.requested"
    durable: true
    persistent: true
    schema:
      type: "object"
      required:
        - messageId
        - eventType
        - version
        - occurredAt
        - correlationId
        - producer
        - data
      properties:
        messageId:
          type: "string"
          format: "uuid"
          example: "a81d43a7-5a02-4d2b-b892-933e4f3a7620"
        eventType:
          type: "string"
          example: "ride.requested"
        version:
          type: "integer"
          example: 1
        occurredAt:
          type: "string"
          format: "date-time"
          example: "2026-10-05T11:00:00.000Z"
        correlationId:
          type: "string"
          example: "req_9876543210"
        producer:
          type: "string"
          example: "m5"
        data:
          type: "object"
          required:
            - rideRequestId
            - clientUserId
            - origin
            - destination
            - vehicleType
            - estimatedFare
            - createdAt
          properties:
            rideRequestId:
              type: "string"
              example: "req_9876543210"
            clientUserId:
              type: "integer"
              description: "ID de usuario numérico canónico de M1"
              example: 42
            origin:
              type: "object"
              properties:
                latitude: { type: "number", example: -27.46 }
                longitude: { type: "number", example: -58.98 }
                address: { type: "string", example: "Av. Costanera 1234" }
            destination:
              type: "object"
              properties:
                latitude: { type: "number", example: -27.47 }
                longitude: { type: "number", example: -58.99 }
                address: { type: "string", example: "San Juan 500" }
            vehicleType:
              type: "string"
              enum: ["AUTO", "MOTO"]
              example: "AUTO"
            estimatedFare:
              type: "object"
              properties:
                amount: { type: "number", example: 2225 }
                currency: { type: "string", example: "ARS" }
            createdAt:
              type: "string"
              format: "date-time"
              example: "2026-10-05T11:00:00.000Z"
