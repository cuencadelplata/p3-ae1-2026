server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    proxy_pass http://m4-api:3004/health;
  }

  location /api/ {
    proxy_pass http://m4-api:3004;
  }

  location /docs {
    proxy_pass http://m4-api:3004;
  }

  location /openapi/ {
    proxy_pass http://m4-api:3004;
  }

  location /scalar/ {
    proxy_pass http://m4-api:3004;
  }
}
