openapi: 3.0.3
info:
  title: M9 – Reservas Programadas
  version: 1.0.0
  description: >
    API REST para administrar y activar reservas programadas. En AE1 M9 no
    implementa autenticación propia: la autenticación pertenece a M1 – Identidad
    y Acceso y su integración queda fuera del alcance actual del módulo.
  license:
    name: Uso académico
servers:
  - url: http://localhost:3000
    description: Ejecución local predeterminada
security: []
tags:
  - name: Salud
    description: Verificación de disponibilidad del servicio.
  - name: Documentación
    description: Contrato OpenAPI del módulo.
  - name: Reservas
    description: Gestión del ciclo de reservas programadas.
paths:
  /health:
    get:
      tags: [Salud]
      summary: Consultar el estado básico del servicio
      operationId: getHealth
      responses:
        '200':
          description: El servicio está disponible.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
              examples:
                disponible: { $ref: '#/components/examples/HealthOk' }
  /openapi.json:
    get:
      tags: [Documentación]
      summary: Obtener la especificación OpenAPI
      operationId: getOpenApiDocument
      responses:
        '200':
          description: Especificación OpenAPI utilizada por Swagger UI.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /reservas:
    post:
      tags: [Reservas]
      summary: Crear una reserva programada
      operationId: crearReserva
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearReservaRequest' }
            examples:
              reservaValida: { $ref: '#/components/examples/CrearReservaValida' }
      responses:
        '201':
          description: Reserva creada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reserva' }
              examples:
                creada: { $ref: '#/components/examples/ReservaProgramada' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '500': { $ref: '#/components/responses/ErrorPersistencia' }
    get:
      tags: [Reservas]
      summary: Listar reservas
      operationId: listarReservas
      responses:
        '200':
          description: Listado ordenado por fecha programada.
          content:
            application/json:
              schema:
                type: object
                required: [reservas]
                properties:
                  reservas:
                    type: array
                    items: { $ref: '#/components/schemas/Reserva' }
              examples:
                listado: { $ref: '#/components/examples/ListadoReservas' }
        '500': { $ref: '#/components/responses/ErrorPersistencia' }
  /reservas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        example: '10000000-0000-4000-8000-000000000001'
    get:
      tags: [Reservas]
      summary: Obtener una reserva
      operationId: obtenerReserva
      responses:
        '200':
          description: Reserva encontrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reserva' }
              examples:
                encontrada: { $ref: '#/components/examples/ReservaProgramada' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/ReservaNoEncontrada' }
        '500': { $ref: '#/components/responses/ErrorPersistencia' }
    patch:
      tags: [Reservas]
      summary: Modificar una reserva PROGRAMADA
      operationId: actualizarReserva
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActualizarReservaRequest' }
            examples:
              modificacionValida: { $ref: '#/components/examples/ActualizarReservaValida' }
      responses:
        '200':
          description: Reserva actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reserva' }
              examples:
                actualizada: { $ref: '#/components/examples/ReservaModificada' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/ReservaNoEncontrada' }
        '409': { $ref: '#/components/responses/ConflictoEstado' }
        '500': { $ref: '#/components/responses/ErrorPersistencia' }
    delete:
      tags: [Reservas]
      summary: Cancelar lógicamente una reserva PROGRAMADA
      operationId: cancelarReserva
      responses:
        '200':
          description: Reserva cancelada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reserva' }
              examples:
                cancelada: { $ref: '#/components/examples/ReservaCancelada' }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '404': { $ref: '#/components/responses/ReservaNoEncontrada' }
        '409': { $ref: '#/components/responses/ReservaNoCancelable' }
        '500': { $ref: '#/components/responses/ErrorPersistencia' }
components:
  responses:
    SolicitudInvalida:
      description: Datos, fecha o identificador inválidos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            fechaInvalida: { $ref: '#/components/examples/ErrorValidacion' }
    ReservaNoEncontrada:
      description: Reserva no encontrada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            inexistente: { $ref: '#/components/examples/ErrorNoEncontrada' }
    ConflictoEstado:
      description: La reserva no se puede modificar o cancelar en su estado actual.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            noModificable: { $ref: '#/components/examples/ErrorNoModificable' }
    ReservaNoCancelable:
      description: La reserva no se puede cancelar en su estado actual.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            noCancelable: { $ref: '#/components/examples/ErrorNoCancelable' }
    ErrorPersistencia:
      description: Error de persistencia.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            interno: { $ref: '#/components/examples/ErrorInterno' }
  examples:
    HealthOk:
      summary: Servicio disponible
      value: { service: m9-reservas-programadas, status: ok }
    CrearReservaValida:
      summary: Solicitud válida de reserva futura
      value:
        clienteId: '20000000-0000-4000-8000-000000000001'
        origen: Terminal de Ómnibus
        destino: Aeropuerto
        vehiculo: AUTO
        fechaHoraProgramada: '2099-01-01T14:30:00-03:00'
    ActualizarReservaValida:
      summary: Cambio de destino de una reserva programada
      value: { destino: Puerto de Buenos Aires }
    ReservaProgramada:
      summary: Reserva creada o consultada
      value:
        id: '10000000-0000-4000-8000-000000000001'
        clienteId: '20000000-0000-4000-8000-000000000001'
        origen: Terminal de Ómnibus
        destino: Aeropuerto
        vehiculo: AUTO
        fechaHoraProgramada: '2099-01-01T17:30:00.000Z'
        estado: PROGRAMADA
        tarifaEstimada: 2500
        moneda: ARS
        criterioAsignacion: MEJOR_CALIFICACION
        idSolicitud: null
        creadoEn: '2099-01-01T14:00:00.000Z'
        actualizadoEn: '2099-01-01T14:00:00.000Z'
    ReservaModificada:
      summary: Reserva modificada correctamente
      value:
        id: '10000000-0000-4000-8000-000000000001'
        clienteId: '20000000-0000-4000-8000-000000000001'
        origen: Terminal de Ómnibus
        destino: Puerto de Buenos Aires
        vehiculo: AUTO
        fechaHoraProgramada: '2099-01-01T17:30:00.000Z'
        estado: PROGRAMADA
        tarifaEstimada: 2500
        moneda: ARS
        criterioAsignacion: MEJOR_CALIFICACION
        idSolicitud: null
        creadoEn: '2099-01-01T14:00:00.000Z'
        actualizadoEn: '2099-01-01T14:05:00.000Z'
    ReservaCancelada:
      summary: Reserva cancelada lógicamente
      value:
        id: '10000000-0000-4000-8000-000000000001'
        clienteId: '20000000-0000-4000-8000-000000000001'
        origen: Terminal de Ómnibus
        destino: Aeropuerto
        vehiculo: AUTO
        fechaHoraProgramada: '2099-01-01T17:30:00.000Z'
        estado: CANCELADA
        tarifaEstimada: 2500
        moneda: ARS
        criterioAsignacion: MEJOR_CALIFICACION
        idSolicitud: null
        creadoEn: '2099-01-01T14:00:00.000Z'
        actualizadoEn: '2099-01-01T14:10:00.000Z'
    ListadoReservas:
      summary: Lista ordenada por fecha programada
      value:
        reservas:
          - id: '10000000-0000-4000-8000-000000000001'
            clienteId: '20000000-0000-4000-8000-000000000001'
            origen: Terminal de Ómnibus
            destino: Aeropuerto
            vehiculo: AUTO
            fechaHoraProgramada: '2099-01-01T17:30:00.000Z'
            estado: PROGRAMADA
            tarifaEstimada: 2500
            moneda: ARS
            criterioAsignacion: MEJOR_CALIFICACION
            idSolicitud: null
            creadoEn: '2099-01-01T14:00:00.000Z'
            actualizadoEn: '2099-01-01T14:00:00.000Z'
    ErrorValidacion:
      summary: Fecha inválida
      value:
        {
          error:
            {
              codigo: FECHA_INVALIDA,
              mensaje: La fecha y hora programada debe ser válida y futura.,
            },
        }
    ErrorNoEncontrada:
      summary: Reserva inexistente
      value: { error: { codigo: RESERVA_NO_ENCONTRADA, mensaje: La reserva no existe. } }
    ErrorNoModificable:
      summary: Reserva cancelada que no puede modificarse
      value:
        {
          error:
            {
              codigo: RESERVA_NO_MODIFICABLE,
              mensaje: Solo se pueden modificar reservas en estado PROGRAMADA.,
            },
        }
    ErrorNoCancelable:
      summary: Reserva que no puede cancelarse
      value:
        {
          error:
            {
              codigo: RESERVA_NO_CANCELABLE,
              mensaje: Solo se pueden cancelar reservas en estado PROGRAMADA.,
            },
        }
    ErrorInterno:
      summary: Error no controlado
      value: { error: { codigo: ERROR_INTERNO, mensaje: Ocurrió un error interno. } }
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service: { type: string, example: m9-reservas-programadas }
        status: { type: string, enum: [ok] }
    CrearReservaRequest:
      type: object
      additionalProperties: false
      required: [clienteId, origen, destino, vehiculo, fechaHoraProgramada]
      properties:
        clienteId: { type: string, format: uuid }
        origen:
          {
            type: string,
            minLength: 1,
            maxLength: 500,
            description: Debe ser diferente de destino.,
          }
        destino:
          { type: string, minLength: 1, maxLength: 500, description: Debe ser diferente de origen. }
        vehiculo: { type: string, enum: [AUTO, MOTO] }
        fechaHoraProgramada:
          {
            type: string,
            format: date-time,
            description: Fecha ISO 8601 con offset y posterior al instante actual.,
          }
    ActualizarReservaRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        origen:
          {
            type: string,
            minLength: 1,
            maxLength: 500,
            description: Debe ser diferente de destino.,
          }
        destino:
          { type: string, minLength: 1, maxLength: 500, description: Debe ser diferente de origen. }
        vehiculo: { type: string, enum: [AUTO, MOTO] }
        fechaHoraProgramada:
          {
            type: string,
            format: date-time,
            description: Fecha ISO 8601 con offset y posterior al instante actual.,
          }
    Reserva:
      type: object
      additionalProperties: false
      required:
        - id
        - clienteId
        - origen
        - destino
        - vehiculo
        - fechaHoraProgramada
        - estado
        - tarifaEstimada
        - moneda
        - criterioAsignacion
        - idSolicitud
        - creadoEn
        - actualizadoEn
      properties:
        id: { type: string, format: uuid }
        clienteId: { type: string, format: uuid }
        origen: { type: string }
        destino: { type: string }
        vehiculo: { type: string, enum: [AUTO, MOTO] }
        fechaHoraProgramada: { type: string, format: date-time }
        estado:
          type: string
          enum: [PROGRAMADA, ACTIVANDO, ACTIVADA, CANCELADA, FALLIDA]
        tarifaEstimada: { type: number, nullable: true }
        moneda: { type: string, nullable: true }
        criterioAsignacion: { type: string, nullable: true }
        idSolicitud: { type: string, format: uuid, nullable: true }
        creadoEn: { type: string, format: date-time, nullable: true }
        actualizadoEn: { type: string, format: date-time, nullable: true }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [codigo, mensaje]
          properties:
            codigo: { type: string }
            mensaje: { type: string }
