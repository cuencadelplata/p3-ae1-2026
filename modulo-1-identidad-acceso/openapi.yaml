openapi: 3.0.3
info:
  title: M1 - Identidad y Acceso
  version: 1.0.0
  description: API de registro, autenticacion, recuperacion de acceso e integracion OAuth2.
servers:
  - url: http://localhost:3001
    description: Ejecucion local
tags:
  - name: Salud
  - name: Identidad y acceso
  - name: Recuperacion
  - name: OAuth2
paths:
  /health:
    get:
      tags: [Salud]
      summary: Comprobar estado del modulo
      responses:
        '200':
          description: Modulo funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: OK }
                  modulo: { type: string, example: M1 - Identidad y Acceso }
  /auth/registrar-usuario:
    post:
      tags: [Identidad y acceso]
      summary: Registrar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              nombre: Juan
              apellido: Perez
              dni: '12345678'
              telefono: '11 1234 5678'
              email: juan.perez@example.com
              password: '123456'
              rol: CLIENTE
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/iniciar-sesion:
    post:
      tags: [Identidad y acceso]
      summary: Iniciar sesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesion iniciada y token JWT generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Usuario bloqueado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >-
            Demasiados intentos fallidos desde la misma IP (por defecto 5 en 60 segundos).
            El contador se guarda en Redis.
          headers:
            Retry-After:
              description: Segundos que faltan para poder volver a intentar
              schema: { type: integer, example: 42 }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: Demasiados intentos fallidos. Intentá de nuevo más tarde }
                  retryAfterSeconds: { type: integer, example: 42 }
  /auth/validar-identidad-y-rol:
    get:
      tags: [Identidad y acceso]
      summary: Validar identidad y rol
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Token valido
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean, example: true }
                  userId: { type: integer, example: 1 }
                  role: { $ref: '#/components/schemas/UserRole' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Identidad y acceso]
      summary: Obtener los datos del usuario autenticado
      description: >-
        Devuelve los datos del usuario dueño del token. El userId se toma del token,
        por lo que cada usuario solo puede consultar sus propios datos. Nunca se devuelve la contraseña.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: integer, example: 12 }
                  nombre: { type: string, example: Franco }
                  apellido: { type: string, example: Perez }
                  dni: { type: string, example: '12345678' }
                  telefono: { type: string, example: 11 1234 5678 }
                  email: { type: string, format: email, example: cliente@example.com }
                  rol: { $ref: '#/components/schemas/UserRole' }
                  estado: { type: string, example: ACTIVO }
                  creadoEn: { type: string, example: '2026-10-04 20:35:00' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Usuario bloqueado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El usuario del token ya no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/solicitar-recuperacion:
    post:
      tags: [Recuperacion]
      summary: Solicitar recuperacion de contraseña
      description: >-
        Genera un token temporal y lo guarda en Redis con un tiempo de vida de 15 minutos.
        Luego publica el evento auth.recuperacion_solicitada en RabbitMQ para que el
        servicio de notificaciones envíe el correo. La respuesta no espera el envío.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: cliente@example.com }
      responses:
        '200':
          description: Solicitud procesada sin revelar si el email existe
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  email: { type: string, format: email }
                  expiresInMinutes: { type: integer, example: 15 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Redis no disponible, no se puede generar el token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/resetear-contrasena:
    post:
      tags: [Recuperacion]
      summary: Restablecer contraseña
      description: >-
        Cambia la contraseña con un token vigente. El token se elimina de Redis al usarlo
        y se revocan los JWT que el usuario tenía emitidos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 6, format: password }
      responses:
        '200':
          description: Contraseña actualizada y token de recuperacion invalidado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Contraseña actualizada exitosamente }
                  email: { type: string, format: email }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token de recuperacion inexistente, vencido o ya utilizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Redis no disponible, no se puede validar el token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/revocar-credenciales:
    post:
      tags: [Recuperacion]
      summary: Revocar las credenciales del usuario autenticado
      description: >-
        Deja sin efecto todos los JWT emitidos hasta el momento para el usuario. La marca
        se guarda en Redis y se publica el evento auth.credenciales_revocadas en RabbitMQ.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Credenciales revocadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  userId: { type: integer, example: 1 }
                  revocadasDesde: { type: integer, description: Momento de la revocacion en segundos (epoch), example: 1791157356 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Redis no disponible, no se pudo guardar la revocacion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/oauth2/authorize:
    get:
      tags: [OAuth2]
      summary: Iniciar autorizacion OAuth2
      parameters:
        - { name: provider, in: query, required: true, schema: { type: string, enum: [GOOGLE, GITHUB, MICROSOFT, CUSTOM] } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: scopes, in: query, required: false, schema: { type: string } }
      responses:
        '501':
          description: Stub pendiente de implementacion real
  /auth/oauth2/callback:
    get:
      tags: [OAuth2]
      summary: Callback OAuth2
      parameters:
        - { name: provider, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
      responses:
        '501':
          description: Stub pendiente de implementacion real
  /auth/oauth2/link:
    post:
      tags: [OAuth2]
      summary: Vincular cuenta OAuth2
      security: [{ bearerAuth: [] }]
      responses:
        '501':
          description: Stub pendiente de implementacion real
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserRole:
      type: string
      enum: [CLIENTE, CONDUCTOR, OPERADOR]
    RegisterRequest:
      type: object
      required: [nombre, apellido, dni, telefono, email, password, rol]
      properties:
        nombre: { type: string, example: Juan }
        apellido: { type: string, example: Perez }
        dni: { type: string, example: '12345678' }
        telefono: { type: string, example: '11 1234 5678' }
        email: { type: string, format: email }
        password: { type: string, minLength: 6, format: password }
        rol: { $ref: '#/components/schemas/UserRole' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    UserResponse:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        apellido: { type: string }
        dni: { type: string }
        telefono: { type: string }
        email: { type: string, format: email }
        rol: { $ref: '#/components/schemas/UserRole' }
        estado: { type: string, enum: [ACTIVO, BLOQUEADO] }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: string, example: 1h }
        usuario: { $ref: '#/components/schemas/UserResponse' }
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: Datos invalidos o incompletos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Credenciales o token invalidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
