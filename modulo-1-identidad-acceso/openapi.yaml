openapi: 3.0.3

info:
  title: M1 - Identidad y Acceso
  version: 1.0.0
  description: |
    API responsable del registro, la autenticacion y la validacion
    de identidad y rol de clientes, conductores y operadores.

servers:
  - url: http://localhost:3001
    description: Ejecucion local

tags:
  - name: Salud
    description: Verificacion del estado del modulo
  - name: Identidad y acceso
    description: Registro, autenticacion y validacion de identidad

paths:
  /health:
    get:
      tags:
        - Salud
      summary: Comprobar el estado del modulo
      operationId: comprobarEstado
      responses:
        "200":
          description: El modulo se encuentra funcionando
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: OK
                modulo: M1 - Identidad y Acceso

  /auth/registrar-usuario:
    post:
      tags:
        - Identidad y acceso
      summary: Registrar un usuario
      description: |
        Registra una nueva identidad con rol CLIENTE, CONDUCTOR u OPERADOR.
        El email debe ser unico y la contrasena debe contener al menos
        seis caracteres.
      operationId: registrarUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              cliente:
                summary: Registrar un cliente
                value:
                  email: cliente@example.com
                  password: "123456"
                  rol: CLIENTE
              conductor:
                summary: Registrar un conductor
                value:
                  email: conductor@example.com
                  password: "123456"
                  rol: CONDUCTOR
              operador:
                summary: Registrar un operador
                value:
                  email: operador@example.com
                  password: "123456"
                  rol: OPERADOR
      responses:
        "201":
          description: Usuario registrado correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
              example:
                id: 1
                email: cliente@example.com
                rol: CLIENTE
                estado: ACTIVO
        "400":
          description: Datos incompletos o invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                datosObligatorios:
                  value:
                    error: Email, password y rol son obligatorios
                passwordInvalida:
                  value:
                    error: La contrasena debe tener al menos 6 caracteres
                rolInvalido:
                  value:
                    error: El rol debe ser CLIENTE, CONDUCTOR u OPERADOR
        "409":
          description: El email ya se encuentra registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Ya existe un usuario con ese email
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/iniciar-sesion:
    post:
      tags:
        - Identidad y acceso
      summary: Iniciar sesion
      description: |
        Valida las credenciales y entrega un token JWT Bearer con
        una duracion de una hora.
      operationId: iniciarSesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: cliente@example.com
              password: "123456"
      responses:
        "200":
          description: Sesion iniciada correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                tokenType: Bearer
                expiresIn: 1h
                usuario:
                  id: 1
                  email: cliente@example.com
                  rol: CLIENTE
                  estado: ACTIVO
        "400":
          description: Email o password ausentes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Email y password son obligatorios
        "401":
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Credenciales incorrectas
        "403":
          description: El usuario se encuentra bloqueado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Usuario bloqueado
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/validar-identidad-y-rol:
    get:
      tags:
        - Identidad y acceso
      summary: Validar identidad y rol
      description: |
        Verifica un token JWT enviado mediante Authorization Bearer y
        devuelve el identificador y el rol incluidos en la credencial.
      operationId: validarIdentidadYRol
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Token valido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenValidationResponse"
              example:
                valid: true
                userId: 1
                role: CLIENTE
        "401":
          description: Token ausente, invalido, mal formado o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              examples:
                tokenAusente:
                  value:
                    valid: false
                    error: Token requerido
                tokenInvalido:
                  value:
                    valid: false
                    error: Token invalido
                tokenExpirado:
                  value:
                    valid: false
                    error: Token expirado
        "500":
          description: JWT_SECRET no esta configurado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthErrorResponse"
              example:
                valid: false
                error: JWT_SECRET no esta configurado

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: Error interno del servidor

  schemas:
    UserRole:
      type: string
      enum:
        - CLIENTE
        - CONDUCTOR
        - OPERADOR
      example: CLIENTE

    UserStatus:
      type: string
      enum:
        - ACTIVO
        - BLOQUEADO
      example: ACTIVO

    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - rol
      properties:
        email:
          type: string
          format: email
          example: cliente@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: "123456"
        rol:
          $ref: "#/components/schemas/UserRole"

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: cliente@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: "123456"

    UserResponse:
      type: object
      required:
        - id
        - email
        - rol
        - estado
      properties:
        id:
          type: integer
          minimum: 1
          example: 1
        email:
          type: string
          format: email
          example: cliente@example.com
        rol:
          $ref: "#/components/schemas/UserRole"
        estado:
          $ref: "#/components/schemas/UserStatus"

    LoginResponse:
      type: object
      required:
        - token
        - tokenType
        - expiresIn
        - usuario
      properties:
        token:
          type: string
          description: Token JWT firmado
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: string
          enum:
            - 1h
        usuario:
          $ref: "#/components/schemas/UserResponse"

    TokenValidationResponse:
      type: object
      required:
        - valid
        - userId
        - role
      properties:
        valid:
          type: boolean
          enum:
            - true
        userId:
          type: integer
          minimum: 1
        role:
          $ref: "#/components/schemas/UserRole"

    HealthResponse:
      type: object
      required:
        - status
        - modulo
      properties:
        status:
          type: string
          enum:
            - OK
        modulo:
          type: string
          enum:
            - M1 - Identidad y Acceso

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    AuthErrorResponse:
      type: object
      required:
        - valid
        - error
      properties:
        valid:
          type: boolean
          enum:
            - false
        error:
          type: string
