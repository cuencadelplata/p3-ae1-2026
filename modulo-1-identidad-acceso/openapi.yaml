openapi: 3.0.3
info:
  title: M1 - Identidad y Acceso
  version: 1.0.0
  description: API de registro, autenticacion, recuperacion de acceso e integracion OAuth2.
servers:
  - url: http://localhost:3001
    description: Ejecucion local
tags:
  - name: Salud
  - name: Identidad y acceso
  - name: Recuperacion
  - name: OAuth2
paths:
  /health:
    get:
      tags: [Salud]
      summary: Comprobar estado del modulo
      responses:
        '200':
          description: Modulo funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: OK }
                  modulo: { type: string, example: M1 - Identidad y Acceso }
  /auth/registrar-usuario:
    post:
      tags: [Identidad y acceso]
      summary: Registrar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              nombre: Juan
              apellido: Perez
              dni: '12345678'
              telefono: '11 1234 5678'
              email: juan.perez@example.com
              password: '123456'
              rol: CLIENTE
      responses:
        '201':
          description: Usuario registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/iniciar-sesion:
    post:
      tags: [Identidad y acceso]
      summary: Iniciar sesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesion iniciada y token JWT generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Usuario bloqueado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: >-
            Demasiados intentos fallidos desde la misma IP (por defecto 5 en 60 segundos).
            El contador se guarda en Redis.
          headers:
            Retry-After:
              description: Segundos que faltan para poder volver a intentar
              schema: { type: integer, example: 42 }
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: Demasiados intentos fallidos. Intentá de nuevo más tarde }
                  retryAfterSeconds: { type: integer, example: 42 }
  /auth/validar-identidad-y-rol:
    get:
      tags: [Identidad y acceso]
      summary: Validar identidad y rol
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Token valido
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean, example: true }
                  userId: { type: integer, example: 1 }
                  role: { $ref: '#/components/schemas/UserRole' }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Identidad y acceso]
      summary: Obtener los datos del usuario autenticado
      description: >-
        Devuelve los datos del usuario dueño del token. El userId se toma del token,
        por lo que cada usuario solo puede consultar sus propios datos. Nunca se devuelve la contraseña.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: integer, example: 12 }
                  nombre: { type: string, example: Franco }
                  apellido: { type: string, example: Perez }
                  dni: { type: string, example: '12345678' }
                  telefono: { type: string, example: 11 1234 5678 }
                  email: { type: string, format: email, example: cliente@example.com }
                  rol: { $ref: '#/components/schemas/UserRole' }
                  estado: { type: string, example: ACTIVO }
                  creadoEn: { type: string, example: '2026-10-04 20:35:00' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Usuario bloqueado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El usuario del token ya no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/solicitar-recuperacion:
    post:
      tags: [Recuperacion]
      summary: Solicitar recuperacion de contraseña
      description: >-
        Genera un token temporal y lo guarda en Redis con un tiempo de vida de 15 minutos.
        Luego publica el evento auth.recuperacion_solicitada en RabbitMQ para que el
        servicio de notificaciones envíe el correo. La respuesta no espera el envío.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: cliente@example.com }
      responses:
        '200':
          description: Solicitud procesada sin revelar si el email existe
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  email: { type: string, format: email }
                  expiresInMinutes: { type: integer, example: 15 }
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: Redis no disponible, no se puede generar el token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/resetear-contrasena:
    post:
      tags: [Recuperacion]
      summary: Restablecer contraseña
      description: >-
        Cambia la contraseña con un token vigente. El token se elimina de Redis al usarlo
        y se revocan los JWT que el usuario tenía emitidos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 6, format: password }
      responses:
        '200':
          description: Contraseña actualizada y token de recuperacion invalidado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Contraseña actualizada exitosamente }
                  email: { type: string, format: email }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token de recuperacion inexistente, vencido o ya utilizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Redis no disponible, no se puede validar el token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/revocar-credenciales:
    post:
      tags: [Recuperacion]
      summary: Revocar las credenciales del usuario autenticado
      description: >-
        Deja sin efecto todos los JWT emitidos hasta el momento para el usuario. La marca
        se guarda en Redis y se publica el evento auth.credenciales_revocadas en RabbitMQ.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Credenciales revocadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  userId: { type: integer, example: 1 }
                  revocadasDesde: { type: integer, description: Momento de la revocacion en segundos (epoch), example: 1791157356 }
                  revocadasDesdeMs: { type: integer, description: Momento exacto de la revocacion en milisegundos (epoch). Los JWT emitidos antes, aunque sea en el mismo segundo, quedan revocados, example: 1791157356421 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Redis no disponible, no se pudo guardar la revocacion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/oauth2/providers:
    get:
      tags: [OAuth2]
      summary: Listar proveedores OAuth2 disponibles
      description: Retorna la lista de proveedores soportados (GOOGLE, AUTH0, MOCK) y su estado de configuracion.
      responses:
        '200':
          description: Lista de proveedores configurados

  /auth/oauth2/authorize:
    get:
      tags: [OAuth2]
      summary: Iniciar autorizacion OAuth2 / OpenID Connect
      parameters:
        - { name: provider, in: query, required: false, schema: { type: string, enum: [GOOGLE, AUTH0, MOCK, GITHUB, MICROSOFT, CUSTOM] } }
        - { name: role, in: query, required: false, schema: { type: string, enum: [CLIENTE, CONDUCTOR, OPERADOR], default: CLIENTE } }
        - { name: redirect_uri, in: query, required: false, schema: { type: string, format: uri } }
        - { name: redirect, in: query, required: false, schema: { type: string, description: "Si es true, redirige con HTTP 302" } }
      responses:
        '200':
          description: URL y state generados exitosamente
        '302':
          description: Redireccion directa al Identity Provider externo

  /auth/oauth2/callback:
    get:
      tags: [OAuth2]
      summary: Callback OAuth2 / OpenID Connect
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: provider, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Autenticacion exitosa y emision de JWT
        '400':
          description: Parametros invalidos o token CSRF alterado
    post:
      tags: [OAuth2]
      summary: Callback OAuth2 via POST
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code: { type: string }
                state: { type: string }
                provider: { type: string }
                redirect_uri: { type: string }
      responses:
        '200':
          description: Autenticacion exitosa y emision de JWT

  /auth/oauth2/link:
    post:
      tags: [OAuth2]
      summary: Vincular cuenta OAuth2 a usuario autenticado
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string }
                code: { type: string }
                state: { type: string }
                provider_id: { type: string }
      responses:
        '200':
          description: Proveedor vinculado exitosamente

  /auth/oauth2/userinfo:
    get:
      tags: [OAuth2]
      summary: Perfil del usuario autenticado via OAuth2
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Perfil completo del usuario e identidades vinculadas

  /auth/token-delegado:
    post:
      tags: [Identidad y acceso]
      summary: Token delegado para M9 (reservas programadas)
      description: >-
        Lo usa M9 cuando llega la hora de una reserva y el pasajero no esta conectado. Se
        autentica con su credencial de servicio (Bearer, variable M9_DISPATCH_AUTH_TOKEN) y
        recibe un JWT de M1 de vida corta a nombre del cliente, que M5 acepta como el de un
        pasajero. Solo para clientes activos. El token lleva sub (cliente), aud "m5",
        scope "ride-requests:write", authMethod "delegated" y act.sub "m9-reservas-programadas".
        Valida como cualquier JWT en /auth/validar-identidad-y-rol.
      security: [{ credencialServicioM9: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId, audience, scope]
              properties:
                clientId: { type: string, description: Id numerico del cliente en M1 (tambien se acepta number), example: '101' }
                audience: { type: string, enum: [m5] }
                scope: { type: string, enum: ['ride-requests:write'] }
      responses:
        '200':
          description: Token emitido (Cache-Control no-store)
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, description: Vida en segundos (300 por defecto), example: 300 }
                  audience: { type: string, example: m5 }
                  scope: { type: string, example: 'ride-requests:write' }
        '400':
          description: clientId invalido (invalid_request) u otro audience o scope (invalid_scope)
        '401':
          description: Falta la credencial de servicio o no coincide (invalid_client)
        '403':
          description: El usuario no es un cliente activo (cliente_no_habilitado)
        '404':
          description: El cliente no existe (cliente_inexistente)
        '503':
          description: M1 no tiene configurada la credencial de M9 (delegacion_no_configurada)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    credencialServicioM9:
      type: http
      scheme: bearer
      description: Credencial de servicio compartida con M9 (no es un JWT)
  schemas:
    UserRole:
      type: string
      enum: [CLIENTE, CONDUCTOR, OPERADOR]
    RegisterRole:
      type: string
      description: Rol permitido para el registro público de identidad.
      enum: [CLIENTE, CONDUCTOR]
    RegisterRequest:
      type: object
      required: [nombre, apellido, dni, telefono, email, password, rol]
      properties:
        nombre: { type: string, example: Juan }
        apellido: { type: string, example: Perez }
        dni: { type: string, example: '12345678' }
        telefono: { type: string, example: '11 1234 5678' }
        email: { type: string, format: email }
        password: { type: string, minLength: 6, format: password }
        rol: { $ref: '#/components/schemas/RegisterRole' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    UserResponse:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        apellido: { type: string }
        dni: { type: string }
        telefono: { type: string }
        email: { type: string, format: email }
        rol: { $ref: '#/components/schemas/UserRole' }
        estado: { type: string, enum: [ACTIVO, BLOQUEADO] }
    LoginResponse:
      type: object
      properties:
        token: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: string, example: 1h }
        usuario: { $ref: '#/components/schemas/UserResponse' }
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
  responses:
    BadRequest:
      description: Datos invalidos o incompletos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Credenciales o token invalidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
