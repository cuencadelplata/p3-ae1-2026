services:
  m1-identidad-acceso:
    image: francok10/m1-identidad-acceso:2

    build:
      context: .
      dockerfile: Dockerfile

    container_name: m1-identidad-acceso

    ports:
      - "3001:3001"

    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-clave-desarrollo-m1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

    volumes:
      - identity_data:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  e2e-tests:
    image: node:24-alpine

    working_dir: /tests

    environment:
      BASE_URL: http://m1-identidad-acceso:3001

    volumes:
      - ./tests/e2e:/tests:ro

    command:
      [
        "node",
        "--test",
        "identidad-acceso.e2e.test.mjs"
      ]

    depends_on:
      m1-identidad-acceso:
        condition: service_healthy

    profiles:
      - test

volumes:
  identity_data: