services:
  postgres:
    image: postgres:17-alpine
    container_name: m8-receipts-db
    environment:
      POSTGRES_DB: m8
      POSTGRES_USER: m8_admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-m8_admin_local}"
      RECEIPTS_DB_PASSWORD: "${RECEIPTS_DB_PASSWORD:-m8_receipts_local}"
    volumes:
      - ../../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m8_admin -d m8"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: m8-receipts-broker
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: m8-receipts-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  m8-documentos:
    build:
      context: ../..
      dockerfile: services/receipts/Dockerfile
    container_name: m8-app
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=production
      - PORT=3008
      - PUBLIC_BASE_URL=http://localhost:3008
      - RECEIPTS_DATABASE_URL=postgres://m8_receipts:${RECEIPTS_DB_PASSWORD:-m8_receipts_local}@postgres:5432/m8
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  test:
    build:
      context: ../..
      dockerfile: services/receipts/Dockerfile
      target: build
    container_name: m8-tests
    working_dir: /workspace
    command: pnpm --filter m8-documentos run test:all
    environment:
      - NODE_ENV=development
      - BASE_URL=http://m8-documentos:3008
      - RECEIPTS_DATABASE_URL=postgres://m8_receipts:${RECEIPTS_DB_PASSWORD:-m8_receipts_local}@postgres:5432/m8
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      m8-documentos:
        condition: service_started
