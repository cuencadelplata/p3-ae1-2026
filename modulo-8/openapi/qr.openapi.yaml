openapi: 3.0.3

info:
  title: M8 - Notificaciones, Documentos y Soporte API
  version: 0.2.0
  description: |
    Contrato HTTP del servicio M8. Esta versiÃ³n documenta RF-8.1,
    Notificaciones de viaje, y RF-8.2, QR de verificaciÃ³n.

tags:
  - name: Health
    description: Disponibilidad técnica básica del servicio QR.
  - name: QR Verification
    description: Generación y validación de QR temporales asociados a viajes.
paths:
  /health:
    get:
      tags:
        - Health
      summary: Consultar disponibilidad del servicio
      description: ComprobaciÃ³n tÃ©cnica sin efectos secundarios ni acceso a reglas de negocio.
      operationId: getHealth
      responses:
        '200':
          description: Servicio M8 disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                serviceAvailable:
                  value:
                    status: ok
                    service: m8

  /qr:
    post:
      tags:
        - QR Verification
      summary: Generar un QR de verificaciÃ³n
      description: |
        Genera un QR temporal y de un solo uso asociado al viaje indicado. El QR
        codifica Ãºnicamente un token opaco; M8 no modifica el estado del viaje.
      operationId: generateQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrGenerationRequest'
            examples:
              tripQr:
                value:
                  tripId: trip-demo-001
      responses:
        '201':
          description: QR generado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrGenerationResponse'
              examples:
                generatedQr:
                  value:
                    token: valor-opaco-generado-por-m8
                    qrDataUrl: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...
                    expiresAt: '2026-09-01T12:05:00.000Z'
        '400':
          description: Solicitud invÃ¡lida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: La solicitud contiene datos invÃ¡lidos.
                      details:
                        - field: tripId
                          reason: Debe ser un string con longitud mÃ­nima de 1.
        '415':
          description: El tipo de contenido no es application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupportedMediaType:
                  value:
                    error:
                      code: UNSUPPORTED_MEDIA_TYPE
                      message: El tipo de contenido debe ser application/json.
        '500':
          description: Error interno al generar el QR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                processingError:
                  value:
                    error:
                      code: QR_PROCESSING_ERROR
                      message: No fue posible generar el QR.

  /qr/validate:
    post:
      tags:
        - QR Verification
      summary: Validar y consumir un QR de verificaciÃ³n
      description: |
        Valida que el token exista, corresponda al viaje indicado, continÃºe
        vigente y no haya sido utilizado. Una validaciÃ³n exitosa consume el QR.
        M8 no inicia ni modifica el viaje.
      operationId: validateQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrValidationRequest'
            examples:
              qrValidation:
                value:
                  tripId: trip-demo-001
                  token: valor-opaco-generado-por-m8
      responses:
        '200':
          description: QR vÃ¡lido y consumido correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrValidationResponse'
              examples:
                validatedQr:
                  value:
                    valid: true
        '400':
          description: Solicitud invÃ¡lida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                validationError:
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: La solicitud contiene datos invÃ¡lidos.
                      details:
                        - field: token
                          reason: Debe ser un string con longitud mÃ­nima de 1.
        '404':
          description: No se encontrÃ³ un QR correspondiente al token y viaje indicados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                qrNotFound:
                  value:
                    error:
                      code: QR_NOT_FOUND
                      message: No se encontrÃ³ un QR correspondiente al token y viaje indicados.
        '409':
          description: El QR ya fue utilizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                qrAlreadyUsed:
                  value:
                    error:
                      code: QR_ALREADY_USED
                      message: El QR ya fue utilizado.
        '410':
          description: El QR venciÃ³.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                qrExpired:
                  value:
                    error:
                      code: QR_EXPIRED
                      message: El QR ha vencido.
        '415':
          description: El tipo de contenido no es application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupportedMediaType:
                  value:
                    error:
                      code: UNSUPPORTED_MEDIA_TYPE
                      message: El tipo de contenido debe ser application/json.
        '500':
          description: Error interno inesperado al validar el QR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalServerError:
                  value:
                    error:
                      code: INTERNAL_SERVER_ERROR
                      message: No fue posible procesar la solicitud.

components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
          description: Indica que el proceso HTTP de M8 estÃ¡ disponible.
        service:
          type: string
          enum:
            - m8
          description: Identificador estable del servicio.

    QrGenerationRequest:
      type: object
      additionalProperties: false
      required:
        - tripId
      properties:
        tripId:
          type: string
          minLength: 1
          description: Identificador del viaje informado por M6.
          example: trip-demo-001

    QrGenerationResponse:
      type: object
      additionalProperties: false
      required:
        - token
        - qrDataUrl
        - expiresAt
      properties:
        token:
          type: string
          minLength: 1
          description: Token opaco codificado por el QR, sin informaciÃ³n sensible.
          example: valor-opaco-generado-por-m8
        qrDataUrl:
          $ref: '#/components/schemas/QrDataUrl'
        expiresAt:
          type: string
          format: date-time
          description: Fecha y hora a partir de la cual el QR deja de ser vÃ¡lido.
          example: '2026-09-01T12:05:00.000Z'

    QrValidationRequest:
      type: object
      additionalProperties: false
      required:
        - tripId
        - token
      properties:
        tripId:
          type: string
          minLength: 1
          description: Identificador del viaje para el que se valida el QR.
          example: trip-demo-001
        token:
          type: string
          minLength: 1
          description: Token opaco obtenido al leer el QR.
          example: valor-opaco-generado-por-m8

    QrValidationResponse:
      type: object
      additionalProperties: false
      required:
        - valid
      properties:
        valid:
          type: boolean
          enum:
            - true
          description: Indica que M8 validÃ³ y consumiÃ³ correctamente el QR.

    QrDataUrl:
      type: string
      pattern: '^data:image/png;base64,'
      description: Data URL PNG de un QR que codifica Ãºnicamente el token opaco.
      example: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'

    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: DescripciÃ³n segura y legible del error.
          example: La solicitud contiene datos invÃ¡lidos.
        details:
          type: array
          description: Detalle opcional de los campos invÃ¡lidos. Se omite en errores internos.
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorCode:
      type: string
      description: CÃ³digo que identifica el tipo de error.
      enum:
        - VALIDATION_ERROR
        - UNSUPPORTED_MEDIA_TYPE
        - NOTIFICATION_PROCESSING_ERROR
        - QR_NOT_FOUND
        - QR_EXPIRED
        - QR_ALREADY_USED
        - QR_PROCESSING_ERROR
        - INTERNAL_SERVER_ERROR
      example: VALIDATION_ERROR

    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: Campo de la solicitud que originÃ³ el error.
          example: channels
        reason:
          type: string
          description: Motivo de invalidaciÃ³n del campo.
          example: Solo se admite PUSH en AE1.
