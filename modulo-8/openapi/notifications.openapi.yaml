openapi: 3.0.3

info:
  title: M8 - Notificaciones, Documentos y Soporte API
  version: 0.2.0
  description: |
    Contrato HTTP del servicio M8. Esta versiÃ³n documenta RF-8.1,
    Notificaciones de viaje, y RF-8.2, QR de verificaciÃ³n.

tags:
  - name: Health
    description: Disponibilidad técnica básica del servicio Notifications.
  - name: Notifications
    description: Procesamiento de notificaciones asociadas a acontecimientos de viaje.
paths:
  /health:
    get:
      tags:
        - Health
      summary: Consultar disponibilidad del servicio
      description: ComprobaciÃ³n tÃ©cnica sin efectos secundarios ni acceso a reglas de negocio.
      operationId: getHealth
      responses:
        '200':
          description: Servicio M8 disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                serviceAvailable:
                  value:
                    status: ok
                    service: m8

  /notifications:
    post:
      tags:
        - Notifications
      summary: Procesar una notificaciÃ³n de viaje
      description: |
        Recibe un acontecimiento de viaje ya ocurrido, valida sus datos y genera
        la notificaciÃ³n correspondiente para el destinatario indicado. M8 no
        decide ni modifica el estado del viaje.
      operationId: processNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
            examples:
              driverAssigned:
                summary: NotificaciÃ³n de asignaciÃ³n de conductor
                value:
                  tripId: trip-123
                  recipientId: user-456
                  eventType: DRIVER_ASSIGNED
                  channels:
                    - PUSH
      responses:
        '201':
          description: NotificaciÃ³n generada y procesada correctamente por M8.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              examples:
                processedNotification:
                  summary: NotificaciÃ³n PUSH procesada
                  value:
                    notificationId: notification-789
                    tripId: trip-123
                    recipientId: user-456
                    eventType: DRIVER_ASSIGNED
                    channels:
                      - PUSH
                    message: Se asignÃ³ un conductor a tu viaje.
                    status: PROCESSED
                    createdAt: '2026-08-31T15:20:00Z'
        '400':
          description: Solicitud invÃ¡lida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupportedChannel:
                  summary: Canal no soportado en esta etapa
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: La solicitud contiene datos invÃ¡lidos.
                      details:
                        - field: channels
                          reason: Solo se admite PUSH en AE1.
        '415':
          description: El tipo de contenido no es application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unsupportedMediaType:
                  value:
                    error:
                      code: UNSUPPORTED_MEDIA_TYPE
                      message: El tipo de contenido debe ser application/json.
        '500':
          description: Error interno al procesar la notificaciÃ³n.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                processingError:
                  value:
                    error:
                      code: NOTIFICATION_PROCESSING_ERROR
                      message: No fue posible procesar la notificaciÃ³n.

components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - ok
          description: Indica que el proceso HTTP de M8 estÃ¡ disponible.
        service:
          type: string
          enum:
            - m8
          description: Identificador estable del servicio.

    NotificationRequest:
      type: object
      additionalProperties: false
      required:
        - tripId
        - recipientId
        - eventType
        - channels
      properties:
        tripId:
          type: string
          minLength: 1
          description: Identificador del viaje informado por un mÃ³dulo externo.
          example: trip-123
        recipientId:
          type: string
          minLength: 1
          description: Identificador del usuario destinatario informado externamente.
          example: user-456
        eventType:
          $ref: '#/components/schemas/EventType'
        channels:
          type: array
          minItems: 1
          uniqueItems: true
          description: Canales por los que M8 debe procesar la notificaciÃ³n.
          items:
            $ref: '#/components/schemas/NotificationChannel'

    EventType:
      type: string
      description: Acontecimiento de viaje que M8 recibe para notificar.
      enum:
        - TRIP_REQUESTED
        - DRIVER_ASSIGNED
        - DRIVER_ARRIVED
        - TRIP_STARTED
        - TRIP_CANCELLED
        - TRIP_COMPLETED

    NotificationChannel:
      type: string
      description: |
        Canal de notificaciÃ³n. PUSH es el Ãºnico canal soportado en AE1; EMAIL y
        SMS podrÃ¡n incorporarse posteriormente sin alterar la lÃ³gica central de
        procesamiento de RF-8.1.
      enum:
        - PUSH

    Notification:
      type: object
      additionalProperties: false
      required:
        - notificationId
        - tripId
        - recipientId
        - eventType
        - channels
        - message
        - status
        - createdAt
      properties:
        notificationId:
          type: string
          description: Identificador asignado por M8 a la notificaciÃ³n procesada.
          example: notification-789
        tripId:
          type: string
          description: Identificador del viaje asociado.
          example: trip-123
        recipientId:
          type: string
          description: Identificador del usuario destinatario.
          example: user-456
        eventType:
          $ref: '#/components/schemas/EventType'
        channels:
          type: array
          minItems: 1
          uniqueItems: true
          description: Canales procesados por M8.
          items:
            $ref: '#/components/schemas/NotificationChannel'
        message:
          type: string
          description: Mensaje generado por M8 a partir de eventType.
          example: Se asignÃ³ un conductor a tu viaje.
        status:
          type: string
          enum:
            - PROCESSED
          description: |
            M8 validÃ³ el evento, generÃ³ la notificaciÃ³n y realizÃ³ correctamente
            el procesamiento correspondiente al canal configurado. Durante AE1,
            el proveedor PUSH es un mock; por lo tanto, este estado no confirma
            la entrega real en el dispositivo del destinatario.
        createdAt:
          type: string
          format: date-time
          description: Fecha y hora de creaciÃ³n asignadas por M8.
          example: '2026-08-31T15:20:00Z'

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/Error'

    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: DescripciÃ³n segura y legible del error.
          example: La solicitud contiene datos invÃ¡lidos.
        details:
          type: array
          description: Detalle opcional de los campos invÃ¡lidos. Se omite en errores internos.
          items:
            $ref: '#/components/schemas/ErrorDetail'

    ErrorCode:
      type: string
      description: CÃ³digo que identifica el tipo de error.
      enum:
        - VALIDATION_ERROR
        - UNSUPPORTED_MEDIA_TYPE
        - NOTIFICATION_PROCESSING_ERROR
        - QR_NOT_FOUND
        - QR_EXPIRED
        - QR_ALREADY_USED
        - QR_PROCESSING_ERROR
        - INTERNAL_SERVER_ERROR
      example: VALIDATION_ERROR

    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - field
        - reason
      properties:
        field:
          type: string
          description: Campo de la solicitud que originÃ³ el error.
          example: channels
        reason:
          type: string
          description: Motivo de invalidaciÃ³n del campo.
          example: Solo se admite PUSH en AE1.
