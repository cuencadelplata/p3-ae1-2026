openapi: 3.0.3
info:
  title: M8 - API integrada
  version: 2.0.1
  description: |
    Contrato HTTP integrado de la aplicación única M8.
    Los RF conservan sus responsabilidades internas, pero todas las rutas se
    exponen desde un único servicio HTTP. M8 no administra el ciclo de vida
    del viaje ni modifica estados pertenecientes a M6.
servers:
  - url: http://localhost:3000
    description: Aplicación integrada del Módulo 8.
tags:
  - name: Notifications
    description: RF8.1. Procesamiento de notificaciones lógicas de viaje.
  - name: QR
    description: RF8.2. QR temporal, vencimiento y consumo de un solo uso.
  - name: Receipts
    description: RF8.3 y RF8.4. Emisión, consulta, descarga y reenvío de comprobantes.
  - name: Support
    description: RF8.5. Contrato completo en rf85-support.yaml.
  - name: NotificationDelivery
    description: RF8.7. Registro de dispositivos y auditoría de entregas PUSH.
paths:
  /health:
    get:
      tags: [Notifications, QR, Receipts, Support, NotificationDelivery]
      summary: Health check agregado del servicio M8
      description: Alias de disponibilidad del único servicio HTTP de M8.
      servers:
        - url: http://localhost:3000
          description: Notifications
        - url: http://localhost:3000
          description: QR
        - url: http://localhost:3000
          description: Receipts
        - url: http://localhost:3000
          description: Support
        - url: http://localhost:3000
          description: NotificationDelivery
      responses:
        '200':
          description: Servicio disponible.
        '503':
          description: Una dependencia crítica del servicio no está disponible.
  /health/live:
    get:
      tags: [QR, NotificationDelivery]
      summary: Vitalidad del proceso, sin consultar dependencias
      servers:
        - url: http://localhost:3000
          description: QR
        - url: http://localhost:3000
          description: NotificationDelivery
      responses:
        '200': { description: Proceso vivo. }
  /health/ready:
    get:
      tags: [QR, NotificationDelivery]
      summary: Disponibilidad del servicio y sus dependencias críticas
      servers:
        - url: http://localhost:3000
          description: QR
        - url: http://localhost:3000
          description: NotificationDelivery
      responses:
        '200': { description: Servicio disponible. }
        '503': { description: Una dependencia crítica del servicio no está disponible. }
  /devices/tokens:
    post:
      tags: [NotificationDelivery]
      summary: Registrar o actualizar un device token del usuario autenticado
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '201': { description: Device token registrado. }
        '400': { description: Solicitud inválida. }
        '401': { description: JWT de M1 ausente o inválido. }
    get:
      tags: [NotificationDelivery]
      summary: Listar los device tokens activos del usuario autenticado
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      responses:
        '200': { description: Tokens activos del usuario. }
        '401': { description: JWT de M1 ausente o inválido. }
  /devices/tokens/{token}:
    delete:
      tags: [NotificationDelivery]
      summary: Desactivar un device token del usuario autenticado
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Token desactivado. }
        '401': { description: JWT de M1 ausente o inválido. }
        '404': { description: Token inexistente o no perteneciente al usuario. }
  /internal/deliveries/{notificationId}:
    get:
      tags: [NotificationDelivery]
      summary: Consultar el estado de una entrega
      description: Solo el destinatario de la entrega o un operador autenticado puede consultarla. La respuesta no expone el device token.
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Estado e historial de intentos de la entrega, sin device token. }
        '401': { description: JWT de M1 ausente o inválido. }
        '403': { description: El usuario autenticado no puede consultar la entrega. }
        '404': { description: Entrega no encontrada. }
  /internal/deliveries/simulate:
    post:
      tags: [NotificationDelivery]
      summary: Simular el procesamiento de una solicitud de entrega
      description: Endpoint técnico disponible fuera de producción para verificar el procesamiento idempotente de `NotificationRequested`.
      servers:
        - url: http://localhost:3000
      responses:
        '200': { description: Solicitud procesada o duplicado reconocido de forma idempotente. }
        '400': { description: Envelope de notificación inválido. }
        '403': { description: Simulación deshabilitada en producción. }
        '502': { description: Falló el proveedor de entrega simulado. }
        '500': { description: Error interno inesperado. }
  /notifications:
    post:
      tags: [Notifications]
      summary: Procesar una notificación de viaje
      description: M8 valida el hecho, genera el mensaje y persiste la notificación lógica. No modifica el estado del viaje.
      servers:
        - url: http://localhost:3000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '201':
          description: Notificación procesada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationResponse'
        '400': { description: Solicitud inválida. }
        '415': { description: Content-Type no admitido. }
  /qr:
    post:
      tags: [QR]
      summary: Generar un QR temporal
      description: Devuelve el QR activo del viaje de forma idempotente. El QR codifica sólo un token opaco.
      servers:
        - url: http://localhost:3000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrGenerationRequest'
      responses:
        '201':
          description: QR generado o QR activo existente devuelto de forma idempotente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrGenerationResponse'
        '400': { description: Solicitud inválida. }
        '415': { description: Content-Type no admitido. }
        '500': { description: Error interno al generar el QR. }
        '503': { description: Almacenamiento de QR no disponible; incluye Retry-After. }
  /qr/validate:
    post:
      tags: [QR]
      summary: Validar y consumir un QR
      description: La validación exitosa consume el QR. Ante concurrencia, sólo una validación puede resultar exitosa.
      servers:
        - url: http://localhost:3000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrValidationRequest'
      responses:
        '200':
          description: QR válido y consumido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrValidationResponse'
        '400': { description: Solicitud inválida. }
        '404': { description: QR no encontrado o no corresponde al viaje. }
        '409': { description: QR ya utilizado. }
        '410': { description: QR vencido. }
        '415': { description: Content-Type no admitido. }
        '500': { description: Error interno inesperado. }
        '503': { description: Almacenamiento de QR no disponible; incluye Retry-After. }
  /api/v1/receipts:
    post:
      tags: [Receipts]
      summary: Emitir un comprobante
      description: RF8.3. La emisión es idempotente por `tripId` y requiere el snapshot de viaje y pago validado por el servicio.
      servers:
        - url: http://localhost:3000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptCreationRequest'
      responses:
        '201':
          description: Comprobante creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponse'
        '200':
          description: Comprobante existente por idempotencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptResponse'
  /api/v1/receipts/{tripId}:
    get:
      tags: [Receipts]
      summary: Consultar un comprobante
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Comprobante encontrado. }
        '401': { description: JWT de M1 ausente o inválido. }
        '403': { description: El usuario autenticado no puede acceder al comprobante. }
        '404': { description: Comprobante no encontrado. }
        '503': { description: Dependencia requerida no disponible. }
  /api/v1/receipts/{tripId}/pdf:
    get:
      tags: [Receipts]
      summary: Descargar PDF del comprobante
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: PDF, content type application/pdf. }
        '401': { description: JWT de M1 ausente o inválido. }
        '403': { description: El usuario autenticado no puede acceder al comprobante. }
        '404': { description: Comprobante no encontrado. }
  /api/v1/receipts/downloads/{token}:
    get:
      tags: [Receipts]
      summary: Descargar un comprobante mediante enlace temporal
      description: Descarga el PDF a partir de un token temporal; no expone ni requiere datos adicionales del viaje.
      servers:
        - url: http://localhost:3000
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: PDF, content type application/pdf. }
        '410': { description: Enlace temporal vencido o inexistente. }
  /api/v1/receipts/{tripId}/resend:
    post:
      tags: [Receipts]
      summary: Reenviar un comprobante existente
      description: RF8.4. Registra un reenvío sin regenerar el PDF y aplica autorización de M1, bloqueo distribuido y límite de solicitudes.
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptResendRequest'
      responses:
        '202': { description: Reenvío aceptado y registrado. }
        '400': { description: Solicitud inválida. }
        '401': { description: JWT de M1 ausente o inválido. }
        '403': { description: El usuario autenticado no puede reenviar el comprobante. }
        '404': { description: Comprobante no encontrado. }
        '409': { description: Ya existe un reenvío concurrente en curso. }
        '422': { description: Datos de reenvío inválidos. }
        '429': { description: Límite de reenvíos superado. }
        '503': { description: Dependencia requerida no disponible. }
  /api/v1/receipts/resend:
    post:
      tags: [Receipts]
      summary: Reenviar un comprobante indicando el viaje en el cuerpo
      description: Variante de RF8.4 que recibe `tripId` dentro del cuerpo JSON.
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptResendRequestWithTripId'
      responses:
        '202': { description: Reenvío aceptado y registrado. }
        '400': { description: Solicitud inválida. }
        '401': { description: JWT de M1 ausente o inválido. }
        '403': { description: El usuario autenticado no puede reenviar el comprobante. }
        '404': { description: Comprobante no encontrado. }
        '409': { description: Ya existe un reenvío concurrente en curso. }
        '422': { description: Datos de reenvío inválidos. }
        '429': { description: Límite de reenvíos superado. }
        '503': { description: Dependencia requerida no disponible. }
  /internal/receipts/{tripId}/delivery-reference:
    get:
      tags: [Receipts]
      summary: Obtener una referencia interna de entrega de comprobante
      description: Ruta interna de coordinación para obtener el enlace temporal y su vencimiento; no pertenece a la API pública.
      servers:
        - url: http://localhost:3000
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Referencia temporal disponible. }
        '400': { description: Identificador de viaje inválido. }
        '404': { description: Comprobante no encontrado. }
        '503': { description: Dependencia requerida no disponible. }
  /tickets:
    post:
      tags: [Support]
      summary: Crear un ticket de soporte
      servers:
        - url: http://localhost:3000
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1 }
        - name: X-Actor-Id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreationRequest'
      security:
        - {}
        - BearerAuth: []
      responses:
        '201':
          description: Ticket creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '200':
          description: Ticket existente por Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401': { description: Sólo con SUPPORT_M1_IDENTITY_URL. Falta el Bearer o M1 no acepta el token. }
        '400': { description: Solicitud inválida. }
        '409': { description: Idempotency-Key usada con otro pedido. }
        '422': { description: El viaje no existe en M6. }
        '503': { description: Base de datos, servicio de viajes de M6 o identidad de M1 no disponible; ante M6 y M1 incluye Retry-After. }
    get:
      tags: [Support]
      summary: Listar tickets con filtros y paginación
      servers:
        - url: http://localhost:3000
      parameters:
        - name: tripId
          in: query
          schema: { type: string }
        - name: estado
          in: query
          schema: { type: string, enum: [ABIERTO, EN_PROCESO, RESUELTO] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      security:
        - {}
        - BearerAuth: []
      responses:
        '401': { description: Sólo con SUPPORT_M1_IDENTITY_URL. Falta el Bearer o M1 no acepta el token. }
        '200': { description: Página de tickets; X-Next-Cursor si hay más. }
        '400': { description: Parámetros inválidos. }
        '503': { description: Base de datos no disponible, o M1 sin responder si la autenticación está habilitada. }
  /tickets/{id}:
    get:
      tags: [Support]
      summary: Consultar un ticket
      servers:
        - url: http://localhost:3000
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      security:
        - {}
        - BearerAuth: []
      responses:
        '401': { description: Sólo con SUPPORT_M1_IDENTITY_URL. Falta el Bearer o M1 no acepta el token. }
        '200': { description: Ticket encontrado. }
        '404': { description: Ticket no encontrado. }
        '503': { description: Base de datos no disponible, o M1 sin responder si la autenticación está habilitada. }
  /tickets/{id}/estado:
    patch:
      tags: [Support]
      summary: Actualizar el estado de un ticket
      servers:
        - url: http://localhost:3000
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: X-Actor-Id
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketStatusChangeRequest'
      security:
        - {}
        - BearerAuth: []
      responses:
        '200':
          description: Ticket actualizado, o sin efecto si ya estaba en ese estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '401': { description: Sólo con SUPPORT_M1_IDENTITY_URL. Falta el Bearer o M1 no acepta el token. }
        '400': { description: Solicitud inválida. }
        '404': { description: Ticket no encontrado. }
        '409': { description: Transición no permitida o conflicto de versión. }
        '503': { description: Base de datos no disponible, o M1 sin responder si la autenticación está habilitada. }
  /tickets/{id}/historial:
    get:
      tags: [Support]
      summary: Consultar el historial de estados de un ticket
      servers:
        - url: http://localhost:3000
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      security:
        - {}
        - BearerAuth: []
      responses:
        '401': { description: Sólo con SUPPORT_M1_IDENTITY_URL. Falta el Bearer o M1 no acepta el token. }
        '200': { description: Historial en orden cronológico. }
        '404': { description: Ticket no encontrado. }
        '503': { description: Base de datos no disponible, o M1 sin responder si la autenticación está habilitada. }
  /events/publish:
    post:
      tags: [Support]
      deprecated: true
      summary: Publicar eventos AE1 en RabbitMQ
      description: Heredado de AE1; sólo con SUPPORT_LEGACY_EVENTS=on. Se retira con la extracción a RF8.6.
      servers:
        - url: http://localhost:3000
      responses:
        '200': { description: Evento publicado. }
        '400': { description: Solicitud inválida. }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT emitido por M1.
  schemas:
    DeviceTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 1 }
        platform: { type: string, enum: [ANDROID, IOS, WEB], default: ANDROID }
    NotificationRequest:
      type: object
      additionalProperties: false
      required: [tripId, recipientId, eventType, channels]
      properties:
        tripId: { type: string, minLength: 1 }
        recipientId: { type: string, minLength: 1 }
        eventType:
          type: string
          enum: [TRIP_REQUESTED, DRIVER_ASSIGNED, DRIVER_ARRIVED, TRIP_STARTED, TRIP_CANCELLED, TRIP_COMPLETED]
        channels:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [PUSH] }
    NotificationResponse:
      type: object
      required: [notificationId, tripId, recipientId, eventType, channels, message, status, createdAt]
      properties:
        notificationId: { type: string }
        tripId: { type: string }
        recipientId: { type: string }
        eventType: { type: string }
        channels: { type: array, items: { type: string } }
        message: { type: string }
        status: { type: string, enum: [PROCESSED] }
        createdAt: { type: string, format: date-time }
    QrGenerationRequest:
      type: object
      additionalProperties: false
      required: [tripId]
      properties:
        tripId: { type: string, minLength: 1 }
    QrGenerationResponse:
      type: object
      additionalProperties: false
      required: [token, qrDataUrl, expiresAt]
      properties:
        token: { type: string, minLength: 1 }
        qrDataUrl:
          type: string
          pattern: '^data:image/png;base64,'
          description: Data URL PNG que codifica únicamente el token opaco.
        expiresAt: { type: string, format: date-time }
    QrValidationRequest:
      type: object
      additionalProperties: false
      required: [tripId, token]
      properties:
        tripId: { type: string, minLength: 1 }
        token: { type: string, minLength: 1 }
    QrValidationResponse:
      type: object
      additionalProperties: false
      required: [valid]
      properties:
        valid: { type: boolean, enum: [true] }
    ReceiptCreationRequest:
      type: object
      description: Snapshot requerido para emitir el comprobante; RF8.3 valida sus campos internos.
      required: [tripId, customer, driver, trip, fare, payment]
      properties:
        tripId: { type: string, minLength: 1 }
        customerUserId: { type: integer }
        driverUserId: { type: integer }
        customer: { type: object }
        driver: { type: object }
        trip: { type: object }
        fare: { type: object }
        payment: { type: object }
    ReceiptResponse:
      type: object
      description: Comprobante emitido o recuperado por idempotencia.
      additionalProperties: true
    TicketCreationRequest:
      type: object
      additionalProperties: false
      required: [motivo]
      anyOf:
        - required: [tripId]
        - required: [viajeId]
      properties:
        tripId: { type: string, minLength: 1 }
        viajeId:
          type: string
          minLength: 1
          deprecated: true
        motivo: { type: string, minLength: 1 }
    TicketStatusChangeRequest:
      type: object
      additionalProperties: false
      required: [estado]
      properties:
        estado: { type: string, enum: [ABIERTO, EN_PROCESO, RESUELTO] }
        expectedVersion: { type: integer, minimum: 1 }
        motivo: { type: string, minLength: 1 }
    TicketResponse:
      type: object
      required: [id, tripId, viajeId, motivo, estado, version, fechaCreacion, fechaActualizacion]
      properties:
        id: { type: string, format: uuid }
        tripId: { type: string }
        viajeId: { type: string, deprecated: true }
        motivo: { type: string }
        estado: { type: string, enum: [ABIERTO, EN_PROCESO, RESUELTO] }
        version: { type: integer, minimum: 1 }
        fechaCreacion: { type: string, format: date-time }
        fechaActualizacion: { type: string, format: date-time }
    ReceiptResendRequest:
      type: object
      properties:
        channel:
          type: string
          enum: [EMAIL, SMS, PUSH]
          default: EMAIL
        destination:
          type: string
      additionalProperties: false
    ReceiptResendRequestWithTripId:
      type: object
      required: [tripId]
      properties:
        tripId:
          type: string
        channel:
          type: string
          enum: [EMAIL, SMS, PUSH]
          default: EMAIL
        destination:
          type: string
      additionalProperties: false
