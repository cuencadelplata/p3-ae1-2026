openapi: 3.0.3
info:
  title: M8 - API integrada
  version: 2.0.0
  description: |
    Índice de los contratos HTTP reales de la aplicación única M8.
    Los RF conservan sus rutas y responsabilidades internas, pero se exponen
    desde un único servicio HTTP.
servers:
  - url: http://localhost:3000
    description: Aplicación integrada del Módulo 8.
tags:
  - name: Notifications
  - name: QR
  - name: Receipts
  - name: Support
    description: RF8.5. Contrato completo en rf85-support.yaml.
  - name: NotificationDelivery
paths:
  /health:
    get:
      tags: [Notifications, QR, Receipts, Support, NotificationDelivery]
      summary: Health check agregado del servicio M8
      description: Alias de disponibilidad del único servicio HTTP de M8.
      servers:
        - url: http://localhost:3000
          description: Notifications
        - url: http://localhost:3000
          description: QR
        - url: http://localhost:3000
          description: Receipts
        - url: http://localhost:3000
          description: Support
        - url: http://localhost:3000
          description: NotificationDelivery
      responses:
        '200':
          description: Servicio disponible.
        '503':
          description: Una dependencia crítica del servicio no está disponible.
  /health/live:
    get:
      tags: [QR, NotificationDelivery]
      summary: Vitalidad del proceso, sin consultar dependencias
      servers:
        - url: http://localhost:3000
          description: QR
        - url: http://localhost:3000
          description: NotificationDelivery
      responses:
        '200': { description: Proceso vivo. }
  /health/ready:
    get:
      tags: [QR, NotificationDelivery]
      summary: Disponibilidad del servicio y sus dependencias críticas
      servers:
        - url: http://localhost:3000
          description: QR
        - url: http://localhost:3000
          description: NotificationDelivery
      responses:
        '200': { description: Servicio disponible. }
        '503': { description: Una dependencia crítica del servicio no está disponible. }
  /devices/tokens:
    post:
      tags: [NotificationDelivery]
      summary: Registrar o actualizar un device token del usuario autenticado
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      responses:
        '201': { description: Device token registrado. }
        '400': { description: Solicitud inválida. }
        '401': { description: JWT de M1 ausente o inválido. }
    get:
      tags: [NotificationDelivery]
      summary: Listar los device tokens activos del usuario autenticado
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      responses:
        '200': { description: Tokens activos del usuario. }
        '401': { description: JWT de M1 ausente o inválido. }
  /devices/tokens/{token}:
    delete:
      tags: [NotificationDelivery]
      summary: Desactivar un device token del usuario autenticado
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Token desactivado. }
        '401': { description: JWT de M1 ausente o inválido. }
        '404': { description: Token inexistente o no perteneciente al usuario. }
  /internal/deliveries/{notificationId}:
    get:
      tags: [NotificationDelivery]
      summary: Consultar el estado de una entrega
      description: Solo el destinatario de la entrega o un operador autenticado puede consultarla. La respuesta no expone el device token.
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Estado e historial de intentos de la entrega, sin device token. }
        '401': { description: JWT de M1 ausente o inválido. }
        '403': { description: El usuario autenticado no puede consultar la entrega. }
        '404': { description: Entrega no encontrada. }
  /internal/deliveries/simulate:
    post:
      tags: [NotificationDelivery]
      summary: Simular el procesamiento de una solicitud de entrega
      description: Endpoint técnico disponible fuera de producción para verificar el procesamiento idempotente de `NotificationRequested`.
      servers:
        - url: http://localhost:3000
      responses:
        '200': { description: Solicitud procesada o duplicado reconocido de forma idempotente. }
        '400': { description: Envelope de notificación inválido. }
        '403': { description: Simulación deshabilitada en producción. }
        '502': { description: Falló el proveedor de entrega simulado. }
        '500': { description: Error interno inesperado. }
  /notifications:
    post:
      tags: [Notifications]
      summary: Procesar una notificación de viaje
      servers:
        - url: http://localhost:3000
      responses:
        '201': { description: Notificación procesada. }
        '400': { description: Solicitud inválida. }
        '415': { description: Content-Type no admitido. }
  /qr:
    post:
      tags: [QR]
      summary: Generar un QR temporal
      servers:
        - url: http://localhost:3000
      responses:
        '201': { description: QR generado. }
        '400': { description: Solicitud inválida. }
        '415': { description: Content-Type no admitido. }
        '500': { description: Error interno al generar el QR. }
        '503': { description: Almacenamiento de QR no disponible; incluye Retry-After. }
  /qr/validate:
    post:
      tags: [QR]
      summary: Validar y consumir un QR
      servers:
        - url: http://localhost:3000
      responses:
        '200': { description: QR válido y consumido. }
        '400': { description: Solicitud inválida. }
        '404': { description: QR no encontrado o no corresponde al viaje. }
        '409': { description: QR ya utilizado. }
        '410': { description: QR vencido. }
        '415': { description: Content-Type no admitido. }
        '500': { description: Error interno inesperado. }
        '503': { description: Almacenamiento de QR no disponible; incluye Retry-After. }
  /api/v1/receipts:
    post:
      tags: [Receipts]
      summary: Emitir un comprobante
      servers:
        - url: http://localhost:3000
      responses:
        '201': { description: Comprobante creado. }
        '200': { description: Comprobante existente por idempotencia. }
  /api/v1/receipts/{tripId}:
    get:
      tags: [Receipts]
      summary: Consultar un comprobante
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Comprobante encontrado. }
        '401': { description: JWT de M1 ausente o inválido. }
        '403': { description: El usuario autenticado no puede acceder al comprobante. }
        '404': { description: Comprobante no encontrado. }
        '503': { description: Dependencia requerida no disponible. }
  /api/v1/receipts/{tripId}/pdf:
    get:
      tags: [Receipts]
      summary: Descargar PDF del comprobante
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: PDF, content type application/pdf. }
        '401': { description: JWT de M1 ausente o inválido. }
        '403': { description: El usuario autenticado no puede acceder al comprobante. }
        '404': { description: Comprobante no encontrado. }
  /api/v1/receipts/downloads/{token}:
    get:
      tags: [Receipts]
      summary: Descargar un comprobante mediante enlace temporal
      description: Descarga el PDF a partir de un token temporal; no expone ni requiere datos adicionales del viaje.
      servers:
        - url: http://localhost:3000
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: PDF, content type application/pdf. }
        '410': { description: Enlace temporal vencido o inexistente. }
  /api/v1/receipts/{tripId}/resend:
    post:
      tags: [Receipts]
      summary: Reenviar un comprobante existente
      description: RF8.4. Registra un reenvío sin regenerar el PDF y aplica autorización de M1, bloqueo distribuido y límite de solicitudes.
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptResendRequest'
      responses:
        '202': { description: Reenvío aceptado y registrado. }
        '400': { description: Solicitud inválida. }
        '401': { description: JWT de M1 ausente o inválido. }
        '403': { description: El usuario autenticado no puede reenviar el comprobante. }
        '404': { description: Comprobante no encontrado. }
        '409': { description: Ya existe un reenvío concurrente en curso. }
        '422': { description: Datos de reenvío inválidos. }
        '429': { description: Límite de reenvíos superado. }
        '503': { description: Dependencia requerida no disponible. }
  /api/v1/receipts/resend:
    post:
      tags: [Receipts]
      summary: Reenviar un comprobante indicando el viaje en el cuerpo
      description: Variante de RF8.4 que recibe `tripId` dentro del cuerpo JSON.
      security:
        - BearerAuth: []
      servers:
        - url: http://localhost:3000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptResendRequestWithTripId'
      responses:
        '202': { description: Reenvío aceptado y registrado. }
        '400': { description: Solicitud inválida. }
        '401': { description: JWT de M1 ausente o inválido. }
        '403': { description: El usuario autenticado no puede reenviar el comprobante. }
        '404': { description: Comprobante no encontrado. }
        '409': { description: Ya existe un reenvío concurrente en curso. }
        '422': { description: Datos de reenvío inválidos. }
        '429': { description: Límite de reenvíos superado. }
        '503': { description: Dependencia requerida no disponible. }
  /internal/receipts/{tripId}/delivery-reference:
    get:
      tags: [Receipts]
      summary: Obtener una referencia interna de entrega de comprobante
      description: Ruta interna de coordinación para obtener el enlace temporal y su vencimiento; no pertenece a la API pública.
      servers:
        - url: http://localhost:3000
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Referencia temporal disponible. }
        '400': { description: Identificador de viaje inválido. }
        '404': { description: Comprobante no encontrado. }
        '503': { description: Dependencia requerida no disponible. }
  /tickets:
    post:
      tags: [Support]
      summary: Crear un ticket de soporte
      servers:
        - url: http://localhost:3000
      responses:
        '201': { description: Ticket creado. }
        '200': { description: Ticket existente por Idempotency-Key. }
        '400': { description: Solicitud inválida. }
        '409': { description: Idempotency-Key usada con otro pedido. }
        '503': { description: Base de datos no disponible. }
    get:
      tags: [Support]
      summary: Listar tickets con filtros y paginación
      servers:
        - url: http://localhost:3000
      parameters:
        - name: tripId
          in: query
          schema: { type: string }
        - name: estado
          in: query
          schema: { type: string, enum: [ABIERTO, EN_PROCESO, RESUELTO] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200': { description: Página de tickets; X-Next-Cursor si hay más. }
        '400': { description: Parámetros inválidos. }
        '503': { description: Base de datos no disponible. }
  /tickets/{id}:
    get:
      tags: [Support]
      summary: Consultar un ticket
      servers:
        - url: http://localhost:3000
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Ticket encontrado. }
        '404': { description: Ticket no encontrado. }
        '503': { description: Base de datos no disponible. }
  /tickets/{id}/estado:
    patch:
      tags: [Support]
      summary: Actualizar el estado de un ticket
      servers:
        - url: http://localhost:3000
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Ticket actualizado, o sin efecto si ya estaba en ese estado. }
        '400': { description: Solicitud inválida. }
        '404': { description: Ticket no encontrado. }
        '409': { description: Transición no permitida o conflicto de versión. }
        '503': { description: Base de datos no disponible. }
  /tickets/{id}/historial:
    get:
      tags: [Support]
      summary: Consultar el historial de estados de un ticket
      servers:
        - url: http://localhost:3000
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Historial en orden cronológico. }
        '404': { description: Ticket no encontrado. }
        '503': { description: Base de datos no disponible. }
  /events/publish:
    post:
      tags: [Support]
      deprecated: true
      summary: Publicar eventos AE1 en RabbitMQ
      description: Heredado de AE1; sólo con SUPPORT_LEGACY_EVENTS=on. Se retira con la extracción a RF8.6.
      servers:
        - url: http://localhost:3000
      responses:
        '200': { description: Evento publicado. }
        '400': { description: Solicitud inválida. }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT emitido por M1.
  schemas:
    ReceiptResendRequest:
      type: object
      properties:
        channel:
          type: string
          enum: [EMAIL, SMS, PUSH]
          default: EMAIL
        destination:
          type: string
      additionalProperties: false
    ReceiptResendRequestWithTripId:
      type: object
      required: [tripId]
      properties:
        tripId:
          type: string
        channel:
          type: string
          enum: [EMAIL, SMS, PUSH]
          default: EMAIL
        destination:
          type: string
      additionalProperties: false
