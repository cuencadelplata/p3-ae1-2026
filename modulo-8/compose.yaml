services:
  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    ports:
      - "3101:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"

  qr:
    build:
      context: .
      dockerfile: services/qr/Dockerfile
    ports:
      - "3103:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      QR_TTL_SECONDS: "${QR_TTL_SECONDS:-300}"

  receipts:
    build:
      context: .
      dockerfile: services/receipts/Dockerfile
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: production
      PORT: "3008"
      PUBLIC_BASE_URL: http://localhost:3008
    volumes:
      - m8-storage:/app/storage

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  support:
    build:
      context: .
      dockerfile: services/support/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  m8-storage:
    name: m8-storage
