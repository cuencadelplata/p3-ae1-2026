services:
  viajes:
    image: p3-ae1-2026-modulo6:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/src/rf-6.1-6.2-6.3/index.js"]
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      M8_URL: http://simulador:3001
      M3_URL: http://simulador:3001
      M4_URL: http://simulador:3001/api/v1
      M7_URL: http://simulador:3001
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DB_HOST: tripdb
      DB_PORT: 5432
      DB_USER: m6
      DB_PASSWORD: m6pass
      DB_NAME: tripdb
    depends_on:
      tripdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      simulador:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  cancelacion:
    image: p3-ae1-2026-modulo6:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/src/rf-6.5-6.6/service-server.js"]
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      RF6_API_URL: http://viajes:3000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      viajes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  fachada:
    image: p3-ae1-2026-modulo6:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/src/rf-6.4-6.7/server.js"]
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      RF6_API_URL: http://viajes:3000
    depends_on:
      viajes:
        condition: service_healthy
    restart: unless-stopped

  simulador:
    image: p3-ae1-2026-modulo6:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/simulator/rf-6.4-6.7/m6-rf-6.4-rf6.7/server.js"]
    expose:
      - "3001"

  tripdb:
    image: p3-ae1-2026-modulo6-db:local
    build:
      context: .
      dockerfile: Dockerfile.postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: m6
      POSTGRES_PASSWORD: m6pass
      POSTGRES_DB: tripdb
    volumes:
      - tripdb-data-v3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m6 -d tripdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tripdb-data-v3:

networks:
  default:
    name: m6_viajes_default