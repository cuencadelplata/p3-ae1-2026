# M6 (Viajes y Ciclo de Vida) dentro del stack común `movilidad-urbana`.
#
# Lo incluye el docker-compose.yml de la raíz. Usa la red `reservas-network`
# y el RabbitMQ y Redis compartidos que define M9, y llama a los módulos reales
# por su nombre de servicio. Para desarrollo y tests aislados con simuladores
# se sigue usando modulo6/docker-compose.yml.
#
# Variables (en el .env de la raíz, nunca en Git):
#   M7_API_KEY, QR_INTERNAL_API_KEY  secretos compartidos con M7 y M8
#   M6_M7_URL, M6_M8_URL             URLs de M7 y M8 si cambian sus nombres de servicio
#   M6_M3_URL                        M3 todavía no está en main: por defecto usa el simulador
#   M6_*_HOST_PORT                   puertos del host (tabla acordada: 15000-15002)
#   RABBITMQ_USER, RABBITMQ_PASSWORD los mismos que usa el RabbitMQ compartido

x-m6-imagen: &m6-imagen
  image: p3-ae1-2026-modulo6:local
  build:
    context: .
    dockerfile: Dockerfile

x-m6-healthcheck: &m6-healthcheck
  test: ["CMD", "node", "-e", "fetch('http://localhost:' + (process.env.PORT || 3000) + '/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 10s

services:
  m6-viajes:
    <<: *m6-imagen
    command: ["node", "--import", "./dist/src/observabilidad/telemetria.js", "dist/src/rf-6.1-6.2-6.3/index.js"]
    ports:
      - "${M6_VIAJES_HOST_PORT:-15000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: m6-tripdb
      DB_PORT: "5432"
      DB_USER: m6
      DB_PASSWORD: "${M6_DB_PASSWORD:-m6pass}"
      DB_NAME: tripdb
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-m9}:${RABBITMQ_PASSWORD:-m9-local}@rabbitmq:5672"
      # Módulos reales por nombre de servicio en reservas-network.
      M4_URL: "${M6_M4_URL:-http://m4-api:3004/api/v1}"
      M7_URL: "${M6_M7_URL:-http://m7-api:3000}"
      M7_API_KEY: "${M7_API_KEY:-}"
      M8_URL: "${M6_M8_URL:-http://m8-app:3000}"
      M8_QR_API_KEY: "${QR_INTERNAL_API_KEY:-}"
      M3_URL: "${M6_M3_URL:-http://m3-api:3000}"
      OTEL_SERVICE_NAME: m6-viajes
      OTEL_EXPORTER_OTLP_ENDPOINT: "${M6_OTEL_ENDPOINT:-}"
    depends_on:
      m6-tripdb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck: *m6-healthcheck
    networks:
      - reservas-network
    restart: unless-stopped

  m6-cancelacion:
    <<: *m6-imagen
    command: ["node", "dist/src/rf-6.5-6.6/service-server.js"]
    ports:
      - "${M6_CANCELACION_HOST_PORT:-15001}:3001"
    environment:
      PORT: "3001"
      RF6_API_URL: http://m6-viajes:3000
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-m9}:${RABBITMQ_PASSWORD:-m9-local}@rabbitmq:5672"
    depends_on:
      m6-viajes:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - reservas-network
    restart: unless-stopped

  m6-fachada:
    <<: *m6-imagen
    command: ["node", "--import", "./dist/src/observabilidad/telemetria.js", "dist/src/rf-6.4-6.7/server.js"]
    ports:
      - "${M6_FACHADA_HOST_PORT:-15002}:3000"
    environment:
      PORT: "3000"
      RF6_API_URL: http://m6-viajes:3000
      OTEL_SERVICE_NAME: m6-fachada-rf-6.4-6.7
      OTEL_EXPORTER_OTLP_ENDPOINT: "${M6_OTEL_ENDPOINT:-}"
    depends_on:
      m6-viajes:
        condition: service_healthy
    healthcheck: *m6-healthcheck
    networks:
      - reservas-network
    restart: unless-stopped

  # Base propia de M6 (una base por servicio). No se publica en el host.
  m6-tripdb:
    image: p3-ae1-2026-modulo6-db:local
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_USER: m6
      POSTGRES_PASSWORD: "${M6_DB_PASSWORD:-m6pass}"
      POSTGRES_DB: tripdb
    volumes:
      - m6-tripdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m6 -d tripdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - reservas-network
    restart: unless-stopped

networks:
  reservas-network:
    driver: bridge

volumes:
  m6-tripdb-data:
