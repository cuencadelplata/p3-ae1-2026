name: M6 integrado - Tests

on:
  push:
    branches: [ '**' ]
    paths:
      - 'modulo6/**'
      - 'README.md'
      - '.github/workflows/m6-tests.yml'
  pull_request:
    branches: [ '**' ]
    paths:
      - 'modulo6/**'
      - 'README.md'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: modulo6/package-lock.json

    - name: Install dependencies
      working-directory: modulo6
      run: npm ci

    - name: Levantar stack integrado
      working-directory: modulo6
      run: docker compose up -d --build

    - name: Compilar servicios
      working-directory: modulo6
      run: npm run build

    - name: Ejecutar tests unitarios
      working-directory: modulo6
      run: npm test

    - name: Ejecutar tests E2E
      working-directory: modulo6
      run: npm run test:e2e

    - name: Detener stack integrado
      if: always()
      working-directory: modulo6
      run: docker compose down