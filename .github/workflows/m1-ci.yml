name: M1 Identidad y Acceso - CI/CD

# Corre solo cuando cambia algo de M1. No toca a los otros módulos.
on:
  push:
    branches: [ '**' ]
    tags: [ 'm1-*' ]
    paths:
      - 'modulo-1-identidad-acceso/**'
      - 'modulo-1-identidad-acceso-ui/**'
      - '.github/workflows/m1-ci.yml'
  pull_request:
    paths:
      - 'modulo-1-identidad-acceso/**'
      - 'modulo-1-identidad-acceso-ui/**'
      - '.github/workflows/m1-ci.yml'
  workflow_dispatch:

jobs:
  # 1. API: compila TypeScript y corre los tests unitarios y de integración.
  api:
    name: API - build y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulo-1-identidad-acceso
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: modulo-1-identidad-acceso/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Tests (unitarios, integración y E2E con mocks)
        run: npm test

  # 2. Interfaz: comprueba que compila.
  ui:
    name: Interfaz - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulo-1-identidad-acceso-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: modulo-1-identidad-acceso-ui/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

  # 3. Imagen Docker: se construye siempre; se publica en Docker Hub
  #    solo en main o en un tag m1-*, y solo si están cargados los secretos.
  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: [ api, ui ]
    env:
      IMAGEN: matsir/m1-identidad-acceso
      HAY_SECRETOS: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
      PUBLICAR: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/m1-')) }}
    steps:
      - uses: actions/checkout@v4

      - name: Etiquetas de la imagen
        id: tags
        run: |
          TAGS="$IMAGEN:sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAGS="$TAGS,$IMAGEN:latest"
          fi
          if [[ "$GITHUB_REF" == refs/tags/m1-* ]]; then
            TAGS="$TAGS,$IMAGEN:${GITHUB_REF_NAME#m1-}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Etiquetas: $TAGS"

      - uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        if: env.PUBLICAR == 'true' && env.HAY_SECRETOS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir (y publicar si corresponde)
        uses: docker/build-push-action@v6
        with:
          context: modulo-1-identidad-acceso
          push: ${{ env.PUBLICAR == 'true' && env.HAY_SECRETOS == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
