name: M8 Workspace CI

on:
  push:
    paths:
      - 'modulo-8/**'
      - '.github/workflows/m8-ci.yml'
  pull_request:
    paths:
      - 'modulo-8/**'
      - '.github/workflows/m8-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate M8 workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modulo-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: modulo-8/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace services
        run: pnpm run build

      - name: Start test backing services
        run: |
          docker compose up -d --wait postgres rabbitmq redis

      - name: Run workspace tests
        run: pnpm run test

      - name: Build Compose services
        run: docker compose build

      - name: Start Compose services
        run: docker compose up -d

      - name: Wait for service health
        run: |
          for url in http://localhost:3101 http://localhost:3103 http://localhost:3008 http://localhost:3000; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent "$url/health" > /dev/null; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Service did not become healthy: $url" >&2
                docker compose ps
                docker compose logs
                exit 1
              fi
              sleep 2
            done
          done

      - name: Run workspace API E2E tests
        run: pnpm run test:e2e

      - name: Stop Compose services
        if: always()
        run: docker compose down --remove-orphans
