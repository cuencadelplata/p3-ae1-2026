name: CI/CD - Grupo 05 (Módulo 2 Clientes)

# Corre solo cuando cambia algo de M2. No toca a los otros módulos.
on:
  push:
    branches: [ '**' ]
    tags: [ 'm2-*' ]
    paths: [ 'm2/**', '.github/workflows/ci-grupo05.yml' ]
  pull_request:
    paths: [ 'm2/**', '.github/workflows/ci-grupo05.yml' ]
  workflow_dispatch:

jobs:
  # 1. API: tipos, build y tests unitarios.
  api:
    name: API - build y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: m2/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (prisma generate + tsc)
        run: npm run build

      - name: Tests unitarios (Vitest)
        run: npm test

  # 2. Cliente: comprueba que compila.
  client:
    name: Cliente - build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: m2/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: m2/client/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

  # 3. Imágenes Docker (api y client en el mismo repositorio, distinto tag).
  #    Se construyen siempre; se publican en Docker Hub solo en main o en un
  #    tag m2-*, y solo si están cargados los secretos.
  docker:
    name: Imagen Docker (${{ matrix.imagen }})
    runs-on: ubuntu-latest
    needs: [ api, client ]
    strategy:
      matrix:
        include:
          - imagen: api
            contexto: m2
          - imagen: client
            contexto: m2/client
    env:
      REPO: leangau/integration-m2-ae2
      # Secretos con prefijo M2_ para no chocar con los de otros módulos.
      HAY_SECRETOS: ${{ secrets.M2_DOCKERHUB_USERNAME != '' && secrets.M2_DOCKERHUB_TOKEN != '' }}
      # Push o ejecución manual (Run workflow) sobre main o un tag m2-*. En PRs nunca publica.
      PUBLICAR: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/m2-')) }}
    steps:
      - uses: actions/checkout@v4

      # main     -> :api, :api-sha-abc1234
      # tag m2-v3 -> :api-v3, :api-sha-abc1234
      - name: Etiquetas de la imagen
        id: tags
        env:
          IMAGEN: ${{ matrix.imagen }}
        run: |
          TAGS="$REPO:$IMAGEN-sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAGS="$TAGS,$REPO:$IMAGEN"
          fi
          if [[ "$GITHUB_REF" == refs/tags/m2-* ]]; then
            TAGS="$TAGS,$REPO:$IMAGEN-${GITHUB_REF_NAME#m2-}"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Etiquetas: $TAGS"

      - name: ¿Se publica?
        run: |
          if [ "$PUBLICAR" != "true" ]; then
            echo "::notice::No se publica: solo en push o Run workflow sobre main o un tag m2-* (evento: $GITHUB_EVENT_NAME, ref: $GITHUB_REF)."
          elif [ "$HAY_SECRETOS" != "true" ]; then
            echo "::warning::No se publica: faltan los secretos M2_DOCKERHUB_USERNAME y/o M2_DOCKERHUB_TOKEN."
          else
            echo "Se publica en Docker Hub."
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        if: env.PUBLICAR == 'true' && env.HAY_SECRETOS == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.M2_DOCKERHUB_USERNAME }}
          password: ${{ secrets.M2_DOCKERHUB_TOKEN }}

      - name: Construir (y publicar si corresponde)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLICAR == 'true' && env.HAY_SECRETOS == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=m2-${{ matrix.imagen }}
          cache-to: type=gha,mode=max,scope=m2-${{ matrix.imagen }}
