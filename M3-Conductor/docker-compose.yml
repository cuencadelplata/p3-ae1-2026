services:
  # Servidor Redis en memoria para mocks y caché
  redis:
    image: redis:7-alpine
    container_name: p3-m3-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Broker de mensajería asíncrona entre módulos (RNF-07). Panel de
  # administración en http://localhost:15672 (admin / admin123)
  rabbitmq:
    image: rabbitmq:4-management
    container_name: p3-m3-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - p3-shared
      - default

  # Cola temporal. Queda apagada mientras RabbitMQ responde.
  # El circuit breaker la enciende con docker start y la apaga con docker stop.
  kafka:
    image: apache/kafka:3.9.1
    container_name: p3-m3-kafka
    hostname: kafka
    restart: "no"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9094,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9094,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - default

  # Backend Node.js - Módulo 3 (Conductores & Valoraciones)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: p3-m3-api
    container_name: p3-m3-api
    restart: unless-stopped
    ports:
      - "5000:3000"

    environment:
      PORT: 3000

      # Redis - comunicación síncrona
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TTL_HABILITADO: ${REDIS_TTL_HABILITADO:-300}
      REDIS_TTL_DISPONIBLE: ${REDIS_TTL_DISPONIBLE:-60}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1000}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-500}
      REDIS_HEALTHCHECK_INTERVAL_MS: ${REDIS_HEALTHCHECK_INTERVAL_MS:-10000}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

      # RabbitMQ - comunicación asíncrona
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      RABBITMQ_EXCHANGE: m3.conductores.events
      KAFKA_BROKERS: kafka:9094
      KAFKA_CONTAINER: p3-m3-kafka
      KAFKA_FALLBACK_TOPIC: m3.fallback

      # Observabilidad: latencia HTTP y saturación → Alloy (puertos 4317/4318)
      OTEL_SERVICE_NAME: m3-conductor-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

networks:
  p3-shared:
    name: p3-shared

volumes:
  redis_data:
  rabbitmq_data:
