services:
  # Servidor Redis en memoria para mocks y caché
  redis:
    image: redis:7-alpine
    container_name: p3-m3-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Broker de mensajería asíncrona entre módulos (RNF-07). Panel de
  # administración en http://localhost:15672 (admin / admin123)
  rabbitmq:
    image: rabbitmq:4-management
    container_name: p3-m3-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - p3-shared
      - default

  # Backend Node.js - Módulo 3 (Conductores & Valoraciones)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: p3-m3-api
    container_name: p3-m3-api
    restart: unless-stopped
    ports:
      - "5000:3000"

    environment:
      PORT: 3000

      # Redis - comunicación síncrona
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TTL_HABILITADO: ${REDIS_TTL_HABILITADO:-300}
      REDIS_TTL_DISPONIBLE: ${REDIS_TTL_DISPONIBLE:-60}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}

      # RabbitMQ - comunicación asíncrona
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: admin
      RABBITMQ_PASSWORD: admin123
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      RABBITMQ_EXCHANGE: m3.conductores.events
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Consumidor de ejemplo de los eventos de M3 (logs: docker compose logs -f consumer)
  consumer:
    image: p3-m3-api
    container_name: p3-m3-consumer
    restart: unless-stopped
    command: ["npm", "run", "consumer"]
    environment:
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
      RABBITMQ_EXCHANGE: m3.conductores.events
      RABBITMQ_EXAMPLE_QUEUE: m3.ejemplo.driver-events
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  # Frontend Web - Módulo 3 (Test Runner & Swagger UI)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.client
    image: p3-m3-frontend
    container_name: p3-m3-frontend
    restart: unless-stopped
    ports:
      - "4000:80"
    depends_on:
      - api

networks:
  p3-shared:
    name: p3-shared

volumes:
  redis_data:
  rabbitmq_data:
