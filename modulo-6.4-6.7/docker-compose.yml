services:
  viajes:
    build:
      context: ../m6_viajes
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      M8_URL: http://simulador:3001
      M3_URL: http://simulador:3001
      M4_URL: http://simulador:3001/api/v1
      M7_URL: http://simulador:3001
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://m6:m6pass@rabbitmq:5672
      DB_HOST: tripdb
      DB_PORT: 5432
      DB_USER: m6
      DB_PASSWORD: m6pass
      DB_NAME: tripdb
    depends_on:
      tripdb:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      simulador:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  tripdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: m6
      POSTGRES_PASSWORD: m6pass
      POSTGRES_DB: tripdb
    volumes:
      - tripdb-data:/var/lib/postgresql/data
      - ../m6_viajes/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m6 -d tripdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine

  rabbitmq:
    image: rabbitmq:3-alpine
    environment:
      RABBITMQ_DEFAULT_USER: m6
      RABBITMQ_DEFAULT_PASS: m6pass

  simulador:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    expose:
      - "3001"

  fachada:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      RF6_API_URL: http://viajes:3000
    depends_on:
      viajes:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tripdb-data:
