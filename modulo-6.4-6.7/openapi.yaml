openapi: 3.0.3
info:
  title: API M6 - Viajes
  version: 1.0.0
paths:
  /api/viajes:
    post:
      summary: Crea un viaje para iniciar su ciclo de vida
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearViaje' }
      responses:
        '201': { description: Viaje creado }
        '400': { description: Datos inválidos }
        '503': { description: Base de datos no disponible }
  /health:
    get:
      summary: Verifica que el proceso HTTP de M6 está activo
      responses:
        '200': { description: Proceso disponible }
  /api/viajes/{viajeId}/finalizacion:
    post:
      summary: Finaliza un viaje y solicita autorización del pago
      parameters:
        - { name: viajeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalizarViaje' }
      responses:
        '200':
          description: Viaje finalizado con métricas estimadas por M4 y pago autorizado por M7
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizacionResponse' }
        '400': { description: Transición inválida }
        '502': { description: Respuesta inválida de una dependencia externa }
        '503': { description: Dependencia externa o base de datos no disponible }
  /api/viajes/{viajeId}/cancelacion-cliente:
    post:
      summary: Cancela un viaje por solicitud del cliente
      parameters:
        - { name: viajeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelarCliente' }
      responses:
        '200': { description: Viaje cancelado }
        '400': { description: Cancelación inválida }
        '503': { description: Dependencia externa o base de datos no disponible }
  /api/viajes/{viajeId}/cancelacion-conductor:
    post:
      summary: Cancela un viaje por solicitud del conductor
      parameters:
        - { name: viajeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelarConductor' }
      responses:
        '200': { description: Viaje cancelado y cliente retornado al despacho }
        '400': { description: Cancelación inválida }
        '503': { description: Dependencia externa o base de datos no disponible }
  /api/viajes/{viajeId}/historial-transiciones:
    get:
      summary: Obtiene el historial de transiciones de un viaje
      parameters:
        - { name: viajeId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Historial de transiciones
          content:
            application/json:
              schema:
                type: object
                required: [historial]
                properties:
                  historial:
                    type: array
                    items: { $ref: '#/components/schemas/TransicionViaje' }
        '404': { description: Viaje no encontrado }
        '503': { description: Base de datos no disponible }
components:
  schemas:
    CrearViaje:
      type: object
      required: [id, clienteId, conductorId, estado, tarifaBase, tarifaPorKm, tarifaPorMinuto, inicio]
      properties:
        id: { type: string }
        clienteId: { type: string }
        conductorId: { type: string }
        estado: { type: string, enum: [solicitado, asignado, en curso, completado, cancelado] }
        tarifaBase: { type: number }
        tarifaPorKm: { type: number }
        tarifaPorMinuto: { type: number }
        inicio: { type: string, format: date-time }
    FinalizarViaje:
      type: object
      required: [origen, destino, tipoVehiculo, horaFin, metodoPago]
      properties:
        origen: { $ref: '#/components/schemas/CoordenadasViaje' }
        destino: { $ref: '#/components/schemas/CoordenadasViaje' }
        tipoVehiculo: { type: string, enum: [auto, moto] }
        horaFin: { type: string, format: date-time }
        metodoPago: { type: string, enum: [efectivo, tarjeta, transferencia] }
    CoordenadasViaje:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        address: { type: string }
    FinalizacionResponse:
      type: object
      required: [viaje, paymentId, metricasEstimadas, fuenteMetrica]
      properties:
        viaje: { $ref: '#/components/schemas/Viaje' }
        paymentId: { type: string }
        metricasEstimadas:
          type: boolean
          enum: [true]
          description: Indica que distancia y duración son estimaciones, no mediciones reales.
        fuenteMetrica:
          type: string
          enum: [M4]
    Viaje:
      type: object
      required: [id, clienteId, conductorId, estado, inicio]
      properties:
        id: { type: string }
        clienteId: { type: string }
        conductorId: { type: string }
        estado: { type: string, enum: [solicitado, asignado, 'en curso', completado, cancelado] }
        inicio: { type: string, format: date-time }
        horaFin: { type: string, format: date-time }
        distanciaKm:
          type: number
          description: Distancia estimada por M4, no distancia real recorrida.
        tiempoMinutos:
          type: number
          description: ETA estimado por M4, no duración real medida.
        total: { type: number }
        metodoPago: { type: string }
        origen: { $ref: '#/components/schemas/CoordenadasViaje' }
        destino: { $ref: '#/components/schemas/CoordenadasViaje' }
        tipoVehiculo: { type: string, enum: [auto, moto] }
        fuenteMetrica: { type: string, enum: [M4] }
        metricasEstimadas: { type: boolean, enum: [true] }
    CancelarCliente:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 1 }
    CancelarConductor:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 1 }
    TransicionViaje:
      type: object
      required: [from, to, timestamp]
      properties:
        from: { type: string, enum: [solicitado, asignado, 'en curso', completado, cancelado] }
        to: { type: string, enum: [solicitado, asignado, 'en curso', completado, cancelado] }
        timestamp: { type: string, format: date-time }
        detalle: { type: string }