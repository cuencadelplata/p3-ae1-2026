openapi: 3.0.0
info:
  title: M6 - Viajes y Ciclo de Vida
  description: |
    API de M6 (Viajes y Ciclo de Vida). AE2: RF-6.1 (estados), RF-6.2 (arribo validado con M3, caché Redis) y RF-6.3 (inicio validado con QR de M8).
    Eventos asíncronos (RabbitMQ) documentados en AE2-M6-documentacion.md.
  version: 2.0.0
  contact:
    name: Equipo M6
  license:
    name: ISC

servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo

tags:
  - name: Viajes
    description: Operaciones relacionadas con viajes

paths:
  /api/viajes:
    post:
      tags:
        - Viajes
      summary: "RF-6.1: Solicitar un nuevo viaje"
      description: Crea el viaje en estado SOLICITADO. Pide a M8 el código de verificación (QR de un solo uso) y persiste el viaje en TripDB.
      operationId: solicitarViaje
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarViajeRequest'
            examples:
              ejemplo1:
                summary: Solicitud básica
                value:
                  clienteId: cliente-123
                  origen: Calle Principal 100
                  destino: Centro Comercial
      responses:
        '201':
          description: Viaje creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeResponse'
              examples:
                exitoso:
                  summary: Respuesta exitosa
                  value:
                    id: "1725167854321"
                    clienteId: cliente-123
                    estado: SOLICITADO
                    origen: Calle Principal 100
                    destino: Centro Comercial
                    codigoVerificacion: "AB3K8F"
                    qrCode: "data:image/png;base64/iVBORw0KGgo..."
                    fechaCreacion: "2026-09-01T15:30:00Z"
        '503':
          description: M8 (QR) o TripDB no disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                m8: { value: { error: "Servicio de QR no disponible, intente más tarde" } }
                db: { value: { error: "Base de datos no disponible, intente más tarde" } }

  /api/viajes/{id}/asignar:
    post:
      tags:
        - Viajes
      summary: "RF-6.2: Asignar conductor a un viaje"
      description: Asigna un conductor a un viaje en estado SOLICITADO y cambia a CONDUCTOR_EN_CAMINO
      operationId: asignarConductor
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarConductorRequest'
            examples:
              ejemplo1:
                summary: Asignar conductor
                value:
                  conductorId: conductor-001
      responses:
        '200':
          description: Conductor asignado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsignarConductorResponse'
        '400':
          description: Error de validación (viaje no en estado SOLICITADO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DbNoDisponible'

  /api/viajes/{id}/arribo:
    put:
      tags:
        - Viajes
      summary: "RF-6.2: Registrar arribo del conductor"
      description: |
        Requiere estado CONDUCTOR_EN_CAMINO y conductor asignado. Consulta a M3 si el conductor está habilitado
        (GET {M3_URL}/conductores/{id}/estado). La respuesta de M3 se cachea en Redis 60 s (clave conductor:{id}:estado).
        Si M3 está caído o excede el timeout responde 503. Al éxito pasa a ARRIBADO y publica el evento viaje.arribado.
      operationId: registrarArribo
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      responses:
        '200':
          description: Arribo registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrarArriboResponse'
        '400':
          description: Transición inválida (viaje no está en CONDUCTOR_EN_CAMINO) o viaje sin conductor asignado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: M3 informa que el conductor no está habilitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { error: "El conductor no está habilitado" }
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: M3 (conductores) o TripDB no disponibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { error: "Servicio de conductores (M3) no disponible, intente más tarde" }

  /api/viajes/{id}/iniciar:
    post:
      tags:
        - Viajes
      summary: "RF-6.3: Iniciar viaje con validación de QR"
      description: |
        Requiere estado ARRIBADO. Envía el código a M8 (POST /qr/validate); M8 lo consume (un solo uso, con expiración).
        Si es válido pasa a EN_CURSO y publica el evento viaje.iniciado.
      operationId: iniciarViaje
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IniciarViajeRequest'
            examples:
              exitoso:
                summary: Código válido
                value:
                  codigoVerificacion: "AB3K8F"
              invalido:
                summary: Código inválido
                value:
                  codigoVerificacion: "INCORRECTO"
      responses:
        '200':
          description: Viaje iniciado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IniciarViajeResponse'
        '400':
          description: Error de validación (viaje no en estado ARRIBADO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Código inválido, inexistente, ya usado, expirado o de otro viaje (motivo informado por M8).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                usado: { value: { error: "QR ya utilizado" } }
                expirado: { value: { error: "QR expirado" } }
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Error inesperado de M8 al validar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: M8 no disponible o timeout, o TripDB no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { error: "Servicio de validación temporalmente no disponible. Intente nuevamente." }

components:
  schemas:
    EstadoViaje:
      type: string
      enum:
        - SOLICITADO
        - ASIGNADO
        - CONDUCTOR_EN_CAMINO
        - ARRIBADO
        - EN_CURSO
        - COMPLETADO
        - CANCELADO
      description: Estados posibles del viaje

    SolicitarViajeRequest:
      type: object
      required:
        - clienteId
        - origen
        - destino
      properties:
        clienteId:
          type: string
          description: Identificador único del cliente
          example: cliente-123
        origen:
          type: string
          description: Dirección de origen del viaje
          example: Calle Principal 100
        destino:
          type: string
          description: Dirección de destino del viaje
          example: Centro Comercial

    ViajeResponse:
      type: object
      properties:
        id:
          type: string
          description: UUID v4 del viaje
          example: "3f0c9c1e-6a51-4d0e-9b57-0c2d1a7f4b11"
        clienteId:
          type: string
          description: ID del cliente que solicitó el viaje
          example: cliente-123
        conductorId:
          type: string
          nullable: true
          description: ID del conductor asignado (null si no está asignado)
          example: null
        estado:
          $ref: '#/components/schemas/EstadoViaje'
        origen:
          type: string
          example: Calle Principal 100
        destino:
          type: string
          example: Centro Comercial
        codigoVerificacion:
          type: string
          description: Código alfanumérico de 6 caracteres para verificación
          example: "AB3K8F"
        qrCode:
          type: string
          nullable: true
          description: "Reservado. Actualmente no se devuelve (la imagen QR la resuelve M8/el cliente a partir de codigoVerificacion)."
        fechaCreacion:
          type: string
          format: date-time
          description: Timestamp de creación del viaje
          example: "2026-09-01T15:30:00Z"

    AsignarConductorRequest:
      type: object
      required:
        - conductorId
      properties:
        conductorId:
          type: string
          description: Identificador único del conductor a asignar
          example: conductor-001

    AsignarConductorResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: "Conductor asignado. Su conductor está en camino a su dirección"
        viaje:
          $ref: '#/components/schemas/ViajeResponse'

    RegistrarArriboResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: "El conductor ha arribado"
        viaje:
          $ref: '#/components/schemas/ViajeResponse'

    IniciarViajeRequest:
      type: object
      required:
        - codigoVerificacion
      properties:
        codigoVerificacion:
          type: string
          description: Código extraído del QR para validar
          example: "AB3K8F"

    IniciarViajeResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: "Viaje iniciado"
        viaje:
          $ref: '#/components/schemas/ViajeResponse'

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Mensaje de error descriptivo
          example: "Viaje no encontrado"

  parameters:
    ViajeId:
      name: id
      in: path
      description: UUID del viaje
      required: true
      schema:
        type: string
        format: uuid
      example: "3f0c9c1e-6a51-4d0e-9b57-0c2d1a7f4b11"

  responses:
    DbNoDisponible:
      description: TripDB no disponible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Base de datos no disponible, intente más tarde"

    NotFound:
      description: Viaje no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Viaje no encontrado"