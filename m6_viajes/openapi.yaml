openapi: 3.0.0
info:
  title: M6 - Viajes y Ciclo de Vida
  description: |
    API de M6 (Viajes y Ciclo de Vida). AE2: RF-6.1 (estados), RF-6.2 (arribo validado con M3, caché Redis),
    RF-6.3 (inicio validado con QR de M8), RF-6.4 (finalización con estimación M4 y pago M7) y RF-6.7 (historial).
    Eventos asíncronos (RabbitMQ) documentados en AE2-M6-documentacion.md.
  version: 2.0.0
  contact:
    name: Equipo M6
  license:
    name: ISC

servers:
  - url: http://localhost:3000
    description: Servidor de desarrollo

tags:
  - name: Viajes
    description: Operaciones relacionadas con viajes

paths:
  /api/viajes:
    post:
      tags:
        - Viajes
      summary: "RF-6.1: Solicitar un nuevo viaje"
      description: Crea el viaje en estado SOLICITADO. M6 solicita el QR a M8 al registrar el arribo.
      operationId: solicitarViaje
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarViajeRequest'
            examples:
              ejemplo1:
                summary: Solicitud básica
                value:
                  clienteId: cliente-123
                  origen: Calle Principal 100
                  destino: Centro Comercial
      responses:
        '201':
              description: Estado no elegible para primer arribo/reintento QR o primer arribo sin conductor asignado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeResponse'
              examples:
                exitoso:
                  summary: Respuesta exitosa
                  value:
                    id: "1725167854321"
                    clienteId: cliente-123
                    estado: SOLICITADO
                    origen: Calle Principal 100
                    destino: Centro Comercial
                    codigoVerificacion: null
                    qrCode: null
                    qrExpiresAt: null
                    fechaCreacion: "2026-09-01T15:30:00Z"
        '503':
          description: TripDB no disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                db: { value: { error: "Base de datos no disponible, intente más tarde" } }

  /api/viajes/{id}:
    get:
      tags:
        - Viajes
      summary: "RF-6.5/RF-6.6: Obtener un viaje para integración"
      operationId: obtenerViaje
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      responses:
        '200':
          description: Viaje encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeIntegracionResponse'
        '404':
          description: El viaje no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: TripDB no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/viajes/{id}/cancelacion:
    patch:
      tags:
        - Viajes
      summary: "RF-6.5/RF-6.6: Cancelar un viaje"
      description: Cancela atómicamente un viaje en estado SOLICITADO o CONDUCTOR_EN_CAMINO.
      operationId: cancelarViaje
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelarViajeRequest'
            example:
              actor: cliente
              motivo: Cambio de planes
      responses:
        '200':
          description: Viaje cancelado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViajeIntegracionResponse'
        '400':
          description: Motivo inválido o transición no permitida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El viaje no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: TripDB no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/viajes/{id}/finalizacion:
    post:
      tags:
        - Viajes
      summary: "RF-6.4: Finalizar un viaje y autorizar el pago"
      description: |
        Requiere estado EN_CURSO. Consulta distancia y ETA a M4, calcula la tarifa y autoriza el pago en M7.
        El cambio de estado y el registro de finalización/historial se confirman atómicamente en TripDB.
      operationId: finalizarViaje
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizarViajeRequest'
            example:
              origen: { latitude: -34.6037, longitude: -58.3816, address: "Calle A" }
              destino: { latitude: -34.6118, longitude: -58.396, address: "Calle B" }
              tipoVehiculo: auto
              horaFin: "2026-10-05T18:00:00Z"
              metodoPago: tarjeta
      responses:
        '200':
          description: Viaje finalizado y pago autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalizarViajeResponse'
        '400':
          description: Datos inválidos o el viaje no está en estado EN_CURSO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El viaje no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: M4 o M7 devolvió una respuesta inválida o rechazó la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: TripDB, M4 o M7 no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/viajes/{id}/historial-transiciones:
    get:
      tags:
        - Viajes
      summary: "RF-6.7: Consultar historial de transiciones"
      description: Devuelve las transiciones registradas en orden cronológico, incluida la finalización del viaje.
      operationId: obtenerHistorialTransiciones
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      responses:
        '200':
          description: Historial del viaje
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistorialTransicionesResponse'
        '404':
          description: El viaje no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: TripDB no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/viajes/{id}/asignar:
    post:
      tags:
        - Viajes
      summary: "RF-6.2: Asignar conductor a un viaje"
      description: Asigna un conductor a un viaje en estado SOLICITADO y cambia a CONDUCTOR_EN_CAMINO
      operationId: asignarConductor
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarConductorRequest'
            examples:
              ejemplo1:
                summary: Asignar conductor
                value:
                  conductorId: conductor-001
      responses:
        '200':
          description: Conductor asignado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsignarConductorResponse'
        '400':
          description: Error de validación (viaje no en estado SOLICITADO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DbNoDisponible'

  /api/viajes/{id}/arribo:
    put:
      tags:
        - Viajes
      summary: "RF-6.2: Registrar arribo del conductor"
      description: |
        Requiere estado CONDUCTOR_EN_CAMINO y conductor asignado. Consulta a M3 si el conductor está habilitado
        (GET {M3_URL}/conductores/{id}/estado). La respuesta de M3 se cachea en Redis 60 s (clave conductor:{id}:estado).
        Si M3 está caído o excede el timeout responde 503. El primer arribo cambia a ARRIBADO y publica
        viaje.arribado una sola vez; después solicita a M8 el QR. Si la generación falla, repetir PUT mientras
        el viaje siga ARRIBADO solo recupera/genera el QR, sin volver a consultar M3 ni republicar el evento.
        La respuesta incluye token, imagen y vencimiento.
      operationId: registrarArribo
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      responses:
        '200':
          description: Arribo registrado; QR generado o reutilizado mientras siga vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrarArriboResponse'
        '400':
            description: Estado no elegible para primer arribo/reintento QR o primer arribo sin conductor asignado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: M3 informa que el conductor no está habilitado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { error: "El conductor no está habilitado" }
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: TripDB o M8 no disponibles.
          headers:
            Retry-After:
              description: Tiempo sugerido para reintentar, cuando lo informa M8.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { error: "No se pudo preparar el QR del viaje" }

  /api/viajes/{id}/iniciar:
    post:
      tags:
        - Viajes
      summary: "RF-6.3: Iniciar viaje con validación de QR"
      description: |
        Requiere estado ARRIBADO. M6 envía {tripId, token} a M8 (POST /qr/validate).
        Solo ante 200 {valid:true} cambia a EN_CURSO y publica viaje.iniciado. Los rechazos de M8
        conservan ARRIBADO; ante 409/410 M6 solicita un QR nuevo si el viaje sigue ARRIBADO.
        Los errores 503/timeout también conservan el estado e incluyen Retry-After cuando M8 lo informa.
      operationId: iniciarViaje
      parameters:
        - $ref: '#/components/parameters/ViajeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IniciarViajeRequest'
            examples:
              exitoso:
                summary: Código válido
                value:
                  codigoVerificacion: "AB3K8F"
              invalido:
                summary: Código inválido
                value:
                  codigoVerificacion: "INCORRECTO"
      responses:
        '200':
          description: Viaje iniciado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IniciarViajeResponse'
        '400':
          description: Error de validación (viaje no en estado ARRIBADO)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Código de verificación local inválido o M8 devolvió valid:false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example: { error: { code: QR_INVALID } }
        '404':
          description: El viaje o el QR no existe.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/M8ErrorResponse'
              example: { error: { code: QR_NOT_FOUND } }
        '409':
          description: QR usado; si el viaje sigue ARRIBADO, se devuelve un QR nuevo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M8ErrorResponse'
              example: { error: { code: QR_ALREADY_USED }, qr: { token: nuevoToken, qrDataUrl: dataUrl, expiresAt: "2026-10-05T12:05:00Z" } }
        '410':
          description: QR expirado; si el viaje sigue ARRIBADO, se devuelve un QR nuevo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/M8ErrorResponse'
              example: { error: { code: QR_EXPIRED }, qr: { token: nuevoToken, qrDataUrl: dataUrl, expiresAt: "2026-10-05T12:05:00Z" } }
        '500':
          description: Error inesperado de M8 al validar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: M8 no disponible o timeout, o TripDB no disponible.
          headers:
            Retry-After:
              description: Tiempo sugerido antes de reintentar, cuando lo informa M8.
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/M8ErrorResponse'
              example: { error: "Servicio de validación temporalmente no disponible. Intente nuevamente." }

components:
  schemas:
    EstadoViaje:
      type: string
      enum:
        - SOLICITADO
        - ASIGNADO
        - CONDUCTOR_EN_CAMINO
        - ARRIBADO
        - EN_CURSO
        - COMPLETADO
        - CANCELADO
      description: Estados posibles del viaje

    SolicitarViajeRequest:
      type: object
      required:
        - clienteId
        - origen
        - destino
      properties:
        clienteId:
          type: string
          description: Identificador único del cliente
          example: cliente-123
        origen:
          type: string
          description: Dirección de origen del viaje
          example: Calle Principal 100
        destino:
          type: string
          description: Dirección de destino del viaje
          example: Centro Comercial

    ViajeResponse:
      type: object
      properties:
        id:
          type: string
          description: UUID v4 del viaje
          example: "3f0c9c1e-6a51-4d0e-9b57-0c2d1a7f4b11"
        clienteId:
          type: string
          description: ID del cliente que solicitó el viaje
          example: cliente-123
        conductorId:
          type: string
          nullable: true
          description: ID del conductor asignado (null si no está asignado)
          example: null
        estado:
          $ref: '#/components/schemas/EstadoViaje'
        origen:
          type: string
          example: Calle Principal 100
        destino:
          type: string
          example: Centro Comercial
          codigoVerificacion:
            type: string
            nullable: true
            description: Token asociado al QR vigente, nulo hasta registrar ARRIBADO.
            example: "AB3K8F"
        qrCode:
          type: string
          nullable: true
            description: Data URL del QR vigente; nulo hasta registrar ARRIBADO.
          qrExpiresAt:
            type: string
            format: date-time
            nullable: true
            description: Expiración del QR; nula hasta registrar ARRIBADO.
        fechaCreacion:
          type: string
          format: date-time
          description: Timestamp de creación del viaje
          example: "2026-09-01T15:30:00Z"

    ViajeIntegracionResponse:
      type: object
      required: [id, clienteId, conductorId, estado]
      properties:
        id:
          type: string
        clienteId:
          type: string
        conductorId:
          type: string
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoViaje'

    CancelarViajeRequest:
      type: object
      required: [actor, motivo]
      properties:
        actor:
          type: string
          enum: [cliente, conductor]
        motivo:
          type: string
          minLength: 1

    CoordenadasFinalizacion:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        address: { type: string }

    FinalizarViajeRequest:
      type: object
      required: [origen, destino, tipoVehiculo, horaFin, metodoPago]
      properties:
        origen:
          $ref: '#/components/schemas/CoordenadasFinalizacion'
        destino:
          $ref: '#/components/schemas/CoordenadasFinalizacion'
        tipoVehiculo:
          type: string
          enum: [auto, moto]
        horaFin:
          type: string
          format: date-time
        metodoPago:
          type: string
          enum: [efectivo, tarjeta, transferencia]

    FinalizarViajeResponse:
      type: object
      required: [viaje, paymentId, metricasEstimadas, fuenteMetrica]
      properties:
        viaje:
          type: object
          required: [id, clienteId, estado, horaFin, total, distanciaKm, tiempoMinutos]
          properties:
            id: { type: string }
            clienteId: { type: string }
            conductorId: { type: string, nullable: true }
            estado: { type: string, enum: [completado] }
            horaFin: { type: string, format: date-time }
            tiempoMinutos: { type: number }
            distanciaKm: { type: number }
            metodoPago: { type: string }
            total: { type: number }
            origen:
              $ref: '#/components/schemas/CoordenadasFinalizacion'
            destino:
              $ref: '#/components/schemas/CoordenadasFinalizacion'
            tipoVehiculo: { type: string, enum: [auto, moto] }
            fuenteMetrica: { type: string, enum: [M4] }
            metricasEstimadas: { type: boolean, enum: [true] }
        paymentId: { type: string }
        metricasEstimadas: { type: boolean, enum: [true] }
        fuenteMetrica: { type: string, enum: [M4] }

    HistorialTransicionesResponse:
      type: object
      required: [historial]
      properties:
        historial:
          type: array
          items:
            type: object
            required: [from, to, timestamp]
            properties:
              from: { type: string }
              to: { type: string }
              timestamp: { type: string, format: date-time }
              detalle: { type: string }

    AsignarConductorRequest:
      type: object
      required:
        - conductorId
      properties:
        conductorId:
          type: string
          description: Identificador único del conductor a asignar
          example: conductor-001

    AsignarConductorResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: "Conductor asignado. Su conductor está en camino a su dirección"
        viaje:
          $ref: '#/components/schemas/ViajeResponse'

    RegistrarArriboResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: "El conductor ha arribado"
        viaje:
          $ref: '#/components/schemas/ViajeResponse'
        qr:
          $ref: '#/components/schemas/QRResponse'

    QRResponse:
      type: object
      required: [token, qrDataUrl, expiresAt]
      properties:
        token: { type: string }
        qrDataUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    IniciarViajeRequest:
      type: object
      required:
        - codigoVerificacion
      properties:
        codigoVerificacion:
          type: string
          description: Código extraído del QR para validar
          example: "AB3K8F"

    IniciarViajeResponse:
      type: object
      properties:
        mensaje:
          type: string
          example: "Viaje iniciado"
        viaje:
          $ref: '#/components/schemas/ViajeResponse'

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Mensaje de error descriptivo
          example: "Viaje no encontrado"

    M8ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              example: QR_EXPIRED
        qr:
          $ref: '#/components/schemas/QRResponse'

  parameters:
    ViajeId:
      name: id
      in: path
      description: UUID del viaje
      required: true
      schema:
        type: string
        format: uuid
      example: "3f0c9c1e-6a51-4d0e-9b57-0c2d1a7f4b11"

  responses:
    DbNoDisponible:
      description: TripDB no disponible
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Base de datos no disponible, intente más tarde"

    NotFound:
      description: Viaje no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: "Viaje no encontrado"